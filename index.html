<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Grid Color Picker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #111111;
  }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid #dddddd;
  }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666666;
  }

  input[type="file"], input[type="number"] {
    border: 1px solid #cccccc;
    padding: 7px 9px;
    font-size: 13px;
    background: #ffffff;
    color: #111111;
    outline: none;
  }
  input[type="number"] { width: 84px; }

  input[type="file"]::file-selector-button {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    padding: 5px 9px;
    margin-right: 8px;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: #111111; color: #ffffff; }

  button {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    height: fit-content;
  }
  button:hover { background: #333333; }
  button:disabled { background: #cccccc; border-color: #cccccc; cursor: not-allowed; }

  #pipBtn { background: #ffffff; color: #111111; }
  #pipBtn:hover:not(:disabled) { background: #111111; color: #ffffff; }
  #pipBtn:disabled { background: #ffffff; color: #cccccc; border-color: #cccccc; }

  .accent-btn { background: #b91c1c; border-color: #b91c1c; }
  .accent-btn:hover:not(:disabled) { background: #7f1414; border-color: #7f1414; }
  .accent-btn:disabled { background: #cccccc; border-color: #cccccc; }

  .info { font-size: 12px; color: #666666; margin-left: auto; }

  .stage { padding: 18px; }

  .grid-wrap {
    display: inline-block;
    position: relative;
    border: 1px solid #dddddd;
    padding: 6px;
    background: #ffffff;
  }

  .calibration-row { display: grid; line-height: 0; }
  .calibration-cell { cursor: default; }
  .center-mark-cell {
    box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 0 4px #111111;
  }

  .grid { display: grid; line-height: 0; }

  .cell { position: relative; width: 22px; height: 22px; cursor: pointer; }

  .cell:hover::after {
    content: "";
    position: absolute;
    inset: 0;
    outline: 2px solid #111111;
    outline-offset: -2px;
  }

  .cell.used { filter: grayscale(1) brightness(1.15); }
  .cell.used::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.35);
  }
  .cell.used::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: var(--check-color, #111111);
    text-shadow: 0 0 2px #fff, 0 0 2px #fff;
  }

  .cell.current { outline: 3px solid #111111; outline-offset: -3px; z-index: 3; }

  .cell.next-preview {
    outline: 1px solid #ffffff;
    outline-offset: -3px;
    box-shadow: inset 0 0 0 1px #000000;
    z-index: 3;
  }

  .placeholder { padding: 60px 20px; text-align: center; color: #999999; font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111111;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .resume-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 2px solid #b91c1c;
    background: #ffffff;
    font-size: 13px;
  }
  .resume-banner button { padding: 5px 10px; font-size: 12px; }
  .resume-dismiss { background: #ffffff; color: #111111; border: 1px solid #cccccc; }
  .resume-dismiss:hover { background: #f2f2f2; }

  /* --- pip idle bar: shown before auto mode starts --- */

  .pip-idle-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid #dddddd;
    flex-shrink: 0;
    font-size: 12px;
  }
  .pip-idle-bar select {
    border: 1px solid #cccccc;
    padding: 5px 6px;
    font-size: 11px;
  }
  .pip-idle-bar button { padding: 6px 12px; font-size: 12px; margin-left: auto; }

  .pip-click-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .pip-click-area.auto-active { border: 2px solid #111111; }

  /* --- translucent auto-mode overlay, faded to black at the top --- */

  .auto-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10px 14px 18px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 10;
    color: #ffffff;
  }

  .auto-overlay-exit {
    width: 24px; height: 24px;
    border: 1px solid #ffffff;
    background: rgba(0,0,0,0.35);
    color: #ffffff;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .auto-overlay-exit:hover { background: #ffffff; color: #111111; }

  .auto-swatch-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .auto-swatch { border: 1px solid rgba(255,255,255,0.6); }
  .auto-swatch.current { width: 44px; height: 44px; border: 2px solid #ffffff; }
  .auto-swatch.previous { width: 26px; height: 26px; opacity: 0.8; }
  .auto-hex { font-family: monospace; font-size: 10px; }

  .auto-family-badge { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; }
  .auto-family-dot { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.7); }

  .auto-status-block { display: flex; flex-direction: column; gap: 2px; font-size: 11px; min-width: 68px; }
  .auto-progress { font-weight: 600; }
  .auto-ago { opacity: 0.8; }

  .auto-nav-btn {
    border: 1px solid #ffffff;
    background: rgba(0,0,0,0.35);
    color: #ffffff;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .auto-nav-btn:hover:not(:disabled) { background: #ffffff; color: #111111; }
  .auto-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .auto-sound-toggle { font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; }

  .auto-save-btn {
    border: 1px solid #ffffff;
    background: rgba(0,0,0,0.35);
    color: #ffffff;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    margin-left: auto;
  }
  .auto-save-btn:hover { background: #ffffff; color: #111111; }

  .auto-hint {
    width: 100%;
    font-size: 10px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>
</head>
<body>

<div id="resumeBannerSlot"></div>

<div class="toolbar-row">
  <div class="field">
    <label for="imageInput">Image</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>
  <div class="field">
    <label for="widthInput">Width (blocks)</label>
    <input type="number" id="widthInput" value="32" min="1" max="256">
  </div>
  <div class="field">
    <label for="heightInput">Height (blocks)</label>
    <input type="number" id="heightInput" value="32" min="1" max="256">
  </div>
  <div class="field">
    <label for="cellSizeInput">Preview size (px)</label>
    <input type="number" id="cellSizeInput" value="22" min="4" max="64">
  </div>
  <button id="generateBtn" disabled>Generate</button>
  <button id="pipBtn" disabled>Pop out</button>
  <div class="info" id="infoText"></div>
</div>

<div class="stage" id="stage">
  <div class="placeholder">Upload an image, set your grid size, and click Generate.</div>
</div>

<div class="toast" id="toast"></div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const cellSizeInput = document.getElementById('cellSizeInput');
  const generateBtn = document.getElementById('generateBtn');
  const pipBtn = document.getElementById('pipBtn');
  const stage = document.getElementById('stage');
  const infoText = document.getElementById('infoText');
  const resumeBannerSlot = document.getElementById('resumeBannerSlot');
  const workCanvas = document.getElementById('workCanvas');
  const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

  const PAD = 6;
  const BORDER = 1;
  const SESSION_KEY = 'pixelGridSession';
  const PIP_DEFAULT_W = 560;
  const PIP_DEFAULT_H = 480;
  const RGB_COLORS = ['#ff0000', '#00ff00', '#0000ff'];
  const RGB_NAMES = { '#ff0000': 'Red', '#00ff00': 'Green', '#0000ff': 'Blue' };

  let loadedImage = null;
  let loadedImageDataURL = null;
  let currentGridWrap = null;
  let pipWindow = null;
  let pipIdleBarEl = null;
  let gridDims = { w: 0, h: 0 };

  // fixed creation order: row-major, top-left to bottom-right
  let orderedCells = [];
  // the order auto mode actually walks (depends on chosen start corner)
  let sequence = [];

  let startVertical = 'top';      // 'top' | 'bottom'
  let startHorizontal = 'left';   // 'left' | 'right'

  let autoModeEnabled = false;
  let autoPointer = -1;
  let currentHex = null;
  let previousHex = null;
  let lastRow = null;
  let lastCopiedAt = null;
  let soundEnabled = true;
  let awaitingReturn = false;
  let watchedWindow = null;
  let autoOverlayInstance = null;
  let liveTimerId = null;

  if (!('documentPictureInPicture' in window)) {
    pipBtn.title = 'Picture-in-picture is not supported in this browser (try Chrome or Edge).';
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // red starts at the rightmost column, then green, then blue, repeating leftward
  function cycleColorFor(x, gridW) {
    const distFromRight = gridW - 1 - x;
    return RGB_COLORS[distFromRight % 3];
  }

  // ---------- clipboard ----------

  async function tryClipboardWrite(win, text) {
    try {
      if (!win.navigator.clipboard || !win.navigator.clipboard.writeText) return false;
      await win.navigator.clipboard.writeText(text);
      return true;
    } catch (err) { return false; }
  }

  function execCommandCopy(win, text) {
    try {
      const ta = win.document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      win.document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = win.document.execCommand('copy');
      win.document.body.removeChild(ta);
      return ok;
    } catch (err) { return false; }
  }

  async function copyToClipboard(text, cellWin) {
    if (await tryClipboardWrite(window, text)) return true;
    if (cellWin !== window && await tryClipboardWrite(cellWin, text)) return true;
    if (execCommandCopy(window, text)) return true;
    if (cellWin !== window && execCommandCopy(cellWin, text)) return true;
    return false;
  }

  function showToastIn(win, msg) {
    let t = win.document.querySelector('.toast');
    if (!t) {
      t = win.document.createElement('div');
      t.className = 'toast';
      win.document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1200);
  }

  function speak(text) {
    if (!soundEnabled) return;
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.9;
        u.volume = 0.6;
        window.speechSynthesis.speak(u);
      }
    } catch (err) { /* ignore */ }
  }

  function formatAgo(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 1) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60) + 's ago';
  }

  // ---------- auto mode engine ----------

  function buildSequence() {
    const gw = gridDims.w, gh = gridDims.h;
    const ys = []; for (let y = 0; y < gh; y++) ys.push(y);
    const xs = []; for (let x = 0; x < gw; x++) xs.push(x);
    const orderedYs = startVertical === 'top' ? ys : ys.slice().reverse();
    const orderedXs = startHorizontal === 'left' ? xs : xs.slice().reverse();
    const seq = [];
    for (const y of orderedYs) for (const x of orderedXs) seq.push(orderedCells[y * gw + x]);
    return seq;
  }

  function rowOf(cell) { return parseInt(cell.dataset.gy, 10); }

  function remainingInRow(pointerIdx) {
    const row = rowOf(sequence[pointerIdx]);
    let remaining = 0;
    for (let i = pointerIdx + 1; i < sequence.length; i++) {
      if (rowOf(sequence[i]) !== row) break;
      remaining++;
    }
    return remaining;
  }

  function activateCell(cell) {
    orderedCells.forEach(c => c.classList.remove('current', 'next-preview'));
    if (currentHex !== null) previousHex = currentHex;
    cell.classList.add('used');
    cell.classList.add('current');
    currentHex = cell.dataset.hex;
    lastCopiedAt = Date.now();

    if (autoPointer + 1 < sequence.length) sequence[autoPointer + 1].classList.add('next-preview');

    const win = cell.ownerDocument.defaultView;
    copyToClipboard(currentHex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + currentHex) : 'Copy failed');
    });

    const familyName = cell.dataset.family;
    const row = rowOf(cell);
    let phrase = familyName;
    if (lastRow !== null && row !== lastRow) {
      phrase = 'Row. ' + familyName;
    } else {
      const remaining = remainingInRow(autoPointer);
      if (remaining > 0 && remaining <= 2) phrase = remaining + ' left. ' + familyName;
    }
    lastRow = row;
    speak(phrase);

    updateAutoOverlay();
  }

  function goNext() {
    if (!autoModeEnabled) return;
    if (autoPointer >= sequence.length - 1) {
      showToastIn(pipWindow || window, 'All done!');
      return;
    }
    autoPointer += 1;
    activateCell(sequence[autoPointer]);
  }

  function goBack() {
    if (!autoModeEnabled) return;
    if (autoPointer <= 0) return;
    autoPointer -= 1;
    activateCell(sequence[autoPointer]);
  }

  function startAuto() {
    if (orderedCells.length === 0 || !pipWindow) return;
    removePipIdleBar();
    sequence = buildSequence();
    const keepProgress = orderedCells.some(c => c.classList.contains('used'));
    autoPointer = keepProgress ? sequence.findIndex(c => !c.classList.contains('used')) : 0;
    if (autoPointer === -1) autoPointer = sequence.length - 1;
    autoModeEnabled = true;
    currentHex = null;
    previousHex = null;
    lastRow = null;
    layoutPipView();
    activateCell(sequence[autoPointer]);
    ensureAutoOverlay();
    attachWatcher(pipWindow);
    startLiveTimer();
  }

  // showIdleBar=false is used when the popup itself is going away
  function stopAuto(showIdleBar) {
    if (showIdleBar === undefined) showIdleBar = true;
    autoModeEnabled = false;
    autoPointer = -1;
    currentHex = null;
    previousHex = null;
    lastRow = null;
    awaitingReturn = false;
    orderedCells.forEach(c => c.classList.remove('current', 'next-preview'));
    detachWatcher(watchedWindow);
    removeAutoOverlay();
    stopLiveTimer();
    if (showIdleBar && pipWindow) {
      ensurePipIdleBar();
      layoutPipView();
    }
  }

  function saveSession() {
    if (!loadedImageDataURL || orderedCells.length === 0) return;
    const usedFlags = orderedCells.map(c => c.classList.contains('used'));
    const cellSize = currentGridWrap ? parseInt(currentGridWrap.dataset.cellSize, 10) : parseInt(cellSizeInput.value, 10);
    const data = {
      imageDataURL: loadedImageDataURL,
      gridW: gridDims.w, gridH: gridDims.h, cellSize,
      startVertical, startHorizontal,
      usedFlags, savedAt: Date.now()
    };
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      showToastIn(pipWindow || window, 'Progress saved');
    } catch (err) {
      showToastIn(pipWindow || window, 'Could not save progress');
    }
  }

  function startLiveTimer() {
    stopLiveTimer();
    liveTimerId = setInterval(() => {
      if (autoOverlayInstance && lastCopiedAt) {
        autoOverlayInstance.agoEl.textContent = formatAgo(Date.now() - lastCopiedAt);
      }
    }, 500);
  }
  function stopLiveTimer() {
    if (liveTimerId) { clearInterval(liveTimerId); liveTimerId = null; }
  }

  // ---------- focus-return + keyboard shortcuts (popup only) ----------

  function onBlurHandler() { if (autoModeEnabled) awaitingReturn = true; }
  function onFocusHandler() {
    if (autoModeEnabled && awaitingReturn) { awaitingReturn = false; goNext(); }
  }
  function onKeyHandler(e) {
    if (!autoModeEnabled) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    else if (e.key === 'Escape') { e.preventDefault(); stopAuto(); }
  }
  function attachWatcher(win) {
    detachWatcher(watchedWindow);
    watchedWindow = win;
    win.addEventListener('blur', onBlurHandler);
    win.addEventListener('focus', onFocusHandler);
    win.addEventListener('keydown', onKeyHandler);
  }
  function detachWatcher(win) {
    if (!win) return;
    win.removeEventListener('blur', onBlurHandler);
    win.removeEventListener('focus', onFocusHandler);
    win.removeEventListener('keydown', onKeyHandler);
    if (win === watchedWindow) watchedWindow = null;
  }

  // ---------- translucent auto-mode overlay ----------

  function buildAutoOverlay(doc) {
    const root = doc.createElement('div');
    root.className = 'auto-overlay';
    root.addEventListener('click', e => e.stopPropagation());

    const exitBtn = doc.createElement('button');
    exitBtn.className = 'auto-overlay-exit';
    exitBtn.textContent = '✕';
    exitBtn.title = 'Exit auto mode';

    const curBlock = doc.createElement('div');
    curBlock.className = 'auto-swatch-block';
    const currentSwatch = doc.createElement('div');
    currentSwatch.className = 'auto-swatch current';
    const currentHexEl = doc.createElement('div');
    currentHexEl.className = 'auto-hex';
    curBlock.appendChild(currentSwatch);
    curBlock.appendChild(currentHexEl);

    const familyBadge = doc.createElement('div');
    familyBadge.className = 'auto-family-badge';
    const familyDot = doc.createElement('span');
    familyDot.className = 'auto-family-dot';
    const familyText = doc.createElement('span');
    familyBadge.appendChild(familyDot);
    familyBadge.appendChild(familyText);

    const prevBlock = doc.createElement('div');
    prevBlock.className = 'auto-swatch-block';
    const prevSwatch = doc.createElement('div');
    prevSwatch.className = 'auto-swatch previous';
    const prevHexEl = doc.createElement('div');
    prevHexEl.className = 'auto-hex';
    prevBlock.appendChild(prevSwatch);
    prevBlock.appendChild(prevHexEl);

    const statusBlock = doc.createElement('div');
    statusBlock.className = 'auto-status-block';
    const progressEl = doc.createElement('div');
    progressEl.className = 'auto-progress';
    const agoEl = doc.createElement('div');
    agoEl.className = 'auto-ago';
    statusBlock.appendChild(progressEl);
    statusBlock.appendChild(agoEl);

    const backBtn = doc.createElement('button');
    backBtn.className = 'auto-nav-btn';
    backBtn.textContent = '↩ Undo';

    const soundLabel = doc.createElement('label');
    soundLabel.className = 'auto-sound-toggle';
    const soundToggle = doc.createElement('input');
    soundToggle.type = 'checkbox';
    soundLabel.appendChild(soundToggle);
    soundLabel.appendChild(doc.createTextNode('Sound'));

    const saveBtn = doc.createElement('button');
    saveBtn.className = 'auto-save-btn';
    saveBtn.textContent = 'Save & Exit';

    const hint = doc.createElement('div');
    hint.className = 'auto-hint';
    hint.textContent = '👆 Click anywhere to copy the next color';

    root.appendChild(exitBtn);
    root.appendChild(curBlock);
    root.appendChild(familyBadge);
    root.appendChild(prevBlock);
    root.appendChild(statusBlock);
    root.appendChild(backBtn);
    root.appendChild(soundLabel);
    root.appendChild(saveBtn);
    root.appendChild(hint);

    exitBtn.addEventListener('click', () => stopAuto());
    backBtn.addEventListener('click', goBack);
    saveBtn.addEventListener('click', () => { saveSession(); stopAuto(); });
    soundToggle.addEventListener('change', () => {
      soundEnabled = soundToggle.checked;
      updateAutoOverlay();
    });

    return { root, currentSwatch, currentHexEl, familyDot, familyText, prevSwatch, prevHexEl, progressEl, agoEl, backBtn, soundToggle };
  }

  function ensureAutoOverlay() {
    if (!pipWindow) return;
    removeAutoOverlay();
    const area = pipWindow.document.querySelector('.pip-click-area');
    if (!area) return;
    area.classList.add('auto-active');
    autoOverlayInstance = buildAutoOverlay(pipWindow.document);
    area.appendChild(autoOverlayInstance.root);
    updateAutoOverlay();
  }

  function removeAutoOverlay() {
    if (autoOverlayInstance) { autoOverlayInstance.root.remove(); autoOverlayInstance = null; }
    if (pipWindow) {
      const area = pipWindow.document.querySelector('.pip-click-area');
      if (area) area.classList.remove('auto-active');
    }
  }

  function updateAutoOverlay() {
    if (!autoOverlayInstance) return;
    const p = autoOverlayInstance;
    p.progressEl.textContent = sequence.length ? `${autoPointer + 1} / ${sequence.length}` : '';
    p.agoEl.textContent = lastCopiedAt ? formatAgo(Date.now() - lastCopiedAt) : '';
    p.currentSwatch.style.background = currentHex || 'transparent';
    p.currentHexEl.textContent = currentHex || '—';
    p.prevSwatch.style.background = previousHex || 'transparent';
    p.prevHexEl.textContent = previousHex || '—';
    p.backBtn.disabled = autoPointer <= 0;
    p.soundToggle.checked = soundEnabled;

    const cell = sequence[autoPointer];
    const familyHex = cell ? cell.dataset.familyHex : '';
    const familyName = cell ? cell.dataset.family : '';
    p.familyDot.style.background = familyHex || 'transparent';
    p.familyText.textContent = familyName || '—';
  }

  // ---------- pip idle bar (popup open, auto mode not running) ----------

  function ensurePipIdleBar() {
    if (!pipWindow) return;
    removePipIdleBar();
    const bar = pipWindow.document.createElement('div');
    bar.className = 'pip-idle-bar';
    bar.addEventListener('click', e => e.stopPropagation());

    const info = pipWindow.document.createElement('span');
    info.textContent = `${gridDims.w} × ${gridDims.h} — ${orderedCells.length} squares`;

    const vSelect = pipWindow.document.createElement('select');
    [['top', 'Start: Top'], ['bottom', 'Start: Bottom']].forEach(([v, l]) => {
      const o = pipWindow.document.createElement('option'); o.value = v; o.textContent = l; vSelect.appendChild(o);
    });
    vSelect.value = startVertical;
    vSelect.addEventListener('change', () => { startVertical = vSelect.value; });

    const hSelect = pipWindow.document.createElement('select');
    [['left', 'From: Left'], ['right', 'From: Right']].forEach(([v, l]) => {
      const o = pipWindow.document.createElement('option'); o.value = v; o.textContent = l; hSelect.appendChild(o);
    });
    hSelect.value = startHorizontal;
    hSelect.addEventListener('change', () => { startHorizontal = hSelect.value; });

    const startBtn = pipWindow.document.createElement('button');
    startBtn.className = 'accent-btn';
    startBtn.textContent = 'Start Auto Mode';
    startBtn.addEventListener('click', () => startAuto());

    bar.appendChild(info);
    bar.appendChild(vSelect);
    bar.appendChild(hSelect);
    bar.appendChild(startBtn);
    pipWindow.document.body.insertBefore(bar, pipWindow.document.body.firstChild);
    pipIdleBarEl = bar;
  }

  function removePipIdleBar() {
    if (pipIdleBarEl) { pipIdleBarEl.remove(); pipIdleBarEl = null; }
  }

  // ---------- grid mounting + PiP ----------

  function applyCellSize(gridWrap, gridW, gridH, cellSize) {
    const grid = gridWrap.querySelector('.grid');
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;
    gridWrap.querySelectorAll('.grid .cell').forEach(c => {
      c.style.width = cellSize + 'px';
      c.style.height = cellSize + 'px';
    });
    gridWrap.querySelectorAll('.calibration-row').forEach(calRow => {
      calRow.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
      calRow.querySelectorAll('.calibration-cell').forEach(c => {
        c.style.width = cellSize + 'px';
        c.style.height = cellSize + 'px';
      });
    });
  }

  // fits the whole grid, plus both reference rows, inside the popup with
  // no cropping or scrolling — recalculated on every resize
  function layoutPipView() {
    if (!pipWindow || !currentGridWrap) return;
    const area = pipWindow.document.querySelector('.pip-click-area');
    if (!area) return;
    const gridW = gridDims.w, gridH = gridDims.h;
    const totalRows = gridH + 2; // top + bottom reference rows

    const availW = Math.max(20, area.clientWidth - 16);
    const availH = Math.max(20, area.clientHeight - 16);

    const sizeByW = Math.floor((availW - PAD * 2 - BORDER * 2) / gridW);
    const sizeByH = Math.floor((availH - PAD * 2 - BORDER * 2) / totalRows);
    const size = Math.max(2, Math.min(sizeByW, sizeByH));

    applyCellSize(currentGridWrap, gridW, gridH, size);
  }

  function restoreManualCellSize() {
    if (!currentGridWrap) return;
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    applyCellSize(currentGridWrap, gridDims.w, gridDims.h, cellSize);
  }

  function mountGrid(gridWrap, gridW, gridH, cellSize) {
    currentGridWrap = gridWrap;
    gridWrap.dataset.gridW = gridW;
    gridWrap.dataset.gridH = gridH;
    gridWrap.dataset.cellSize = cellSize;

    if (pipWindow) {
      let area = pipWindow.document.querySelector('.pip-click-area');
      if (!area) {
        area = pipWindow.document.createElement('div');
        area.className = 'pip-click-area';
        area.addEventListener('click', () => { if (autoModeEnabled) goNext(); });
        pipWindow.document.body.appendChild(area);
      }
      area.querySelectorAll('.grid-wrap').forEach(el => el.remove());
      area.appendChild(gridWrap);
      layoutPipView();
    } else {
      stage.innerHTML = '';
      stage.appendChild(gridWrap);
    }

    pipBtn.disabled = !('documentPictureInPicture' in window);
  }

  function onPipResize() { layoutPipView(); }

  async function openPip() {
    if (pipWindow) return pipWindow;
    if (!('documentPictureInPicture' in window)) return null;
    if (!currentGridWrap) return null;

    pipWindow = await documentPictureInPicture.requestWindow({ width: PIP_DEFAULT_W, height: PIP_DEFAULT_H });

    for (const styleEl of document.querySelectorAll('style')) {
      pipWindow.document.head.appendChild(styleEl.cloneNode(true));
    }
    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.style.background = '#ffffff';
    pipWindow.document.body.style.overflow = 'hidden';
    pipWindow.document.body.style.display = 'flex';
    pipWindow.document.body.style.flexDirection = 'column';
    pipWindow.document.body.style.height = '100vh';

    const gridW = parseInt(currentGridWrap.dataset.gridW, 10);
    const gridH = parseInt(currentGridWrap.dataset.gridH, 10);
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    mountGrid(currentGridWrap, gridW, gridH, cellSize);

    pipWindow.addEventListener('resize', onPipResize);
    ensurePipIdleBar();
    layoutPipView();

    pipWindow.addEventListener('pagehide', () => {
      stopAuto(false);
      pipWindow = null;
      pipIdleBarEl = null;
      stage.innerHTML = '';
      stage.appendChild(currentGridWrap);
      restoreManualCellSize();
    }, { once: true });

    return pipWindow;
  }

  // ---------- cell click handling ----------

  function handleCellClick(index) {
    if (autoModeEnabled) return; // the popup's click-area listener handles advancing
    const cell = orderedCells[index];
    const hex = cell.dataset.hex;
    const win = cell.ownerDocument.defaultView;
    copyToClipboard(hex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + hex) : 'Copy failed');
    });
    cell.classList.toggle('used');
  }

  // ---------- image + grid building ----------

  function buildCalibrationRow(gridW, cellSize) {
    const row = document.createElement('div');
    row.className = 'calibration-row';
    row.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    const centerXs = gridW % 2 === 1 ? [(gridW - 1) / 2] : [gridW / 2 - 1, gridW / 2];

    for (let x = 0; x < gridW; x++) {
      const hex = cycleColorFor(x, gridW);
      const sq = document.createElement('div');
      sq.className = 'cell calibration-cell';
      sq.style.width = cellSize + 'px';
      sq.style.height = cellSize + 'px';
      sq.style.background = hex;
      sq.title = hex + ' — alignment reference, not copyable';
      if (centerXs.includes(x)) sq.classList.add('center-mark-cell');
      row.appendChild(sq);
    }
    return row;
  }

  function buildGridFromImage(img, gridW, gridH, cellSize) {
    workCanvas.width = gridW;
    workCanvas.height = gridH;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, gridW, gridH);

    let pixelData;
    try {
      pixelData = ctx.getImageData(0, 0, gridW, gridH).data;
    } catch (err) { return null; }

    orderedCells = [];
    gridDims = { w: gridW, h: gridH };

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;

    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const idx = (y * gridW + x) * 4;
        const r = pixelData[idx], g = pixelData[idx + 1], b = pixelData[idx + 2];
        const hex = rgbToHex(r, g, b);

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.background = hex;
        cell.title = hex;
        cell.dataset.hex = hex;
        cell.dataset.gx = x;
        cell.dataset.gy = y;

        // checkmark color, and the auto-mode family badge, match the
        // reference rows' expected color for this column
        const famHex = cycleColorFor(x, gridW);
        cell.dataset.familyHex = famHex;
        cell.dataset.family = RGB_NAMES[famHex];
        cell.style.setProperty('--check-color', famHex);

        const cellIndex = orderedCells.length;
        cell.addEventListener('click', () => handleCellClick(cellIndex));
        orderedCells.push(cell);

        grid.appendChild(cell);
      }
    }

    const calibrationTop = buildCalibrationRow(gridW, cellSize);
    const calibrationBottom = buildCalibrationRow(gridW, cellSize);
    gridWrap.appendChild(calibrationTop);
    gridWrap.appendChild(grid);
    gridWrap.appendChild(calibrationBottom);

    return gridWrap;
  }

  // ---------- resume from localStorage ----------

  function offerResume() {
    let raw;
    try { raw = localStorage.getItem(SESSION_KEY); } catch (err) { return; }
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (err) { return; }
    if (!data || !data.imageDataURL || !data.gridW || !data.gridH) return;

    const usedCount = Array.isArray(data.usedFlags) ? data.usedFlags.filter(Boolean).length : 0;
    const total = data.gridW * data.gridH;

    const banner = document.createElement('div');
    banner.className = 'resume-banner';
    const text = document.createElement('span');
    text.textContent = `Saved session found — ${data.gridW} × ${data.gridH}, ${usedCount} of ${total} placed.`;
    const resumeBtn = document.createElement('button');
    resumeBtn.textContent = 'Resume';
    const dismissBtn = document.createElement('button');
    dismissBtn.className = 'resume-dismiss';
    dismissBtn.textContent = 'Dismiss';

    resumeBtn.addEventListener('click', () => { resumeSession(data); banner.remove(); });
    dismissBtn.addEventListener('click', () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
      banner.remove();
    });

    banner.appendChild(text);
    banner.appendChild(resumeBtn);
    banner.appendChild(dismissBtn);
    resumeBannerSlot.appendChild(banner);
  }

  async function resumeSession(data) {
    const img = new Image();
    img.onload = async () => {
      loadedImage = img;
      loadedImageDataURL = data.imageDataURL;
      generateBtn.disabled = false;
      widthInput.value = data.gridW;
      heightInput.value = data.gridH;
      cellSizeInput.value = data.cellSize;
      startVertical = data.startVertical || 'top';
      startHorizontal = data.startHorizontal || 'left';

      stopAuto(false);
      const gridWrap = buildGridFromImage(img, data.gridW, data.gridH, data.cellSize);
      if (!gridWrap) return;

      if (Array.isArray(data.usedFlags)) {
        data.usedFlags.forEach((used, i) => {
          if (used && orderedCells[i]) orderedCells[i].classList.add('used');
        });
      }

      mountGrid(gridWrap, data.gridW, data.gridH, data.cellSize);
      infoText.textContent = `${data.gridW} × ${data.gridH} = ${data.gridW * data.gridH} blocks`;

      if ('documentPictureInPicture' in window) await openPip();
      startAuto();
    };
    img.src = data.imageDataURL;
  }

  // ---------- events ----------

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) { loadedImage = null; loadedImageDataURL = null; generateBtn.disabled = true; return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        loadedImageDataURL = e.target.result;
        generateBtn.disabled = false;
        const w = parseInt(widthInput.value, 10) || 32;
        const ratio = img.height / img.width;
        heightInput.value = Math.max(1, Math.round(w * ratio));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  widthInput.addEventListener('change', () => {
    if (!loadedImage) return;
    const w = parseInt(widthInput.value, 10) || 32;
    const ratio = loadedImage.height / loadedImage.width;
    heightInput.value = Math.max(1, Math.round(w * ratio));
  });

  [widthInput, heightInput, cellSizeInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !generateBtn.disabled) generateBtn.click();
    });
  });

  generateBtn.addEventListener('click', () => {
    if (!loadedImage) return;
    const gridW = Math.max(1, Math.min(256, parseInt(widthInput.value, 10) || 32));
    const gridH = Math.max(1, Math.min(256, parseInt(heightInput.value, 10) || 32));
    const cellSize = Math.max(4, Math.min(64, parseInt(cellSizeInput.value, 10) || 22));

    stopAuto(false);
    const gridWrap = buildGridFromImage(loadedImage, gridW, gridH, cellSize);
    if (!gridWrap) {
      stage.innerHTML = '<div class="placeholder">Could not read image data (possibly a cross-origin image).</div>';
      return;
    }
    mountGrid(gridWrap, gridW, gridH, cellSize);
    infoText.textContent = `${gridW} × ${gridH} = ${gridW * gridH} blocks`;
    if (pipWindow) ensurePipIdleBar();
  });

  pipBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if (!('documentPictureInPicture' in window)) {
      showToastIn(window, 'PiP not supported in this browser');
      return;
    }
    await openPip();
  });

  offerResume();
</script>

</body>
