<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Grid Color Picker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #111111;
  }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    padding: 12px 20px;
  }

  .toolbar-row + .toolbar-row {
    border-top: 1px solid #eeeeee;
  }

  .topbar {
    border-bottom: 1px solid #dddddd;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666666;
  }

  input[type="file"],
  input[type="number"],
  select {
    border: 1px solid #cccccc;
    padding: 8px 10px;
    font-size: 14px;
    background: #ffffff;
    color: #111111;
    outline: none;
  }

  input[type="number"] {
    width: 90px;
  }

  input[type="file"]::file-selector-button {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    padding: 6px 10px;
    margin-right: 10px;
    cursor: pointer;
  }

  input[type="file"]::file-selector-button:hover {
    background: #111111;
    color: #ffffff;
  }

  button {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    height: fit-content;
  }

  button:hover {
    background: #333333;
  }

  button:disabled {
    background: #cccccc;
    border-color: #cccccc;
    cursor: not-allowed;
  }

  #pipBtn {
    background: #ffffff;
    color: #111111;
  }

  #pipBtn:hover:not(:disabled) {
    background: #111111;
    color: #ffffff;
  }

  #pipBtn:disabled {
    background: #ffffff;
    color: #cccccc;
    border-color: #cccccc;
  }

  .accent-btn {
    background: #b91c1c;
    border-color: #b91c1c;
  }

  .accent-btn:hover:not(:disabled) {
    background: #7f1414;
    border-color: #7f1414;
  }

  .accent-btn:disabled {
    background: #cccccc;
    border-color: #cccccc;
  }

  .info {
    font-size: 13px;
    color: #666666;
    margin-left: auto;
  }

  .stage {
    padding: 20px;
  }

  .grid-wrap {
    display: inline-block;
    position: relative;
    border: 1px solid #dddddd;
    padding: 6px;
    background: #ffffff;
  }

  .grid {
    display: grid;
    line-height: 0;
    position: relative;
  }

  .cell {
    position: relative;
    width: 22px;
    height: 22px;
    cursor: pointer;
  }

  .cell:hover::after {
    content: "";
    position: absolute;
    inset: 0;
    outline: 2px solid #111111;
    outline-offset: -2px;
  }

  .cell.used {
    filter: grayscale(1) brightness(1.15);
  }

  .cell.used::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.35);
  }

  /* Default checkmark uses mix-blend-mode so it stays legible on any color */
  .cell.used::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #ffffff;
    mix-blend-mode: difference;
  }

  /* RGB alignment marker cells (top-right 3 squares) get a colored, non-blended check */
  .cell.used[data-marker]::after {
    mix-blend-mode: normal;
    text-shadow: 0 0 2px rgba(255,255,255,0.95), 0 0 2px rgba(255,255,255,0.95);
  }
  .cell.used[data-marker="red"]::after   { color: #e11d1d; }
  .cell.used[data-marker="green"]::after { color: #16a34a; }
  .cell.used[data-marker="blue"]::after  { color: #2563eb; }

  .cell.current {
    outline: 3px solid #111111;
    outline-offset: -3px;
    z-index: 3;
  }

  /* The square that will be copied next */
  .cell.next {
    outline: 3px solid #ffffff;
    outline-offset: -3px;
    box-shadow: 0 0 0 1px #111111 inset;
    z-index: 4;
  }

  /* Center alignment ticks, drawn as thin lines across the cell */
  .center-tick {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    background: rgba(211, 32, 32, 0.6);
  }
  .center-tick-v {
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    margin-left: -1px;
  }
  .center-tick-h {
    top: 50%;
    left: 0;
    height: 2px;
    width: 100%;
    margin-top: -1px;
  }

  /* RGB alignment reference squares, sit above the grid, right-aligned */
  .marker-strip {
    display: flex;
    justify-content: flex-end;
    gap: 0;
    margin-bottom: 4px;
  }
  .marker-square {
    position: relative;
    border: 1px solid rgba(0,0,0,0.45);
    cursor: pointer;
  }
  .marker-square.marker-red   { background: #e11d1d; }
  .marker-square.marker-green { background: #16a34a; }
  .marker-square.marker-blue  { background: #2563eb; }
  .marker-square.checked::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: bold;
    text-shadow: 0 0 2px rgba(0,0,0,0.85);
  }

  /* Darkening overlays used to dim the rows/columns adjacent to the active one */
  .row-dim {
    position: absolute;
    background: rgba(0, 0, 0, 0.62);
    pointer-events: none;
    z-index: 5;
    display: none;
  }

  .placeholder {
    padding: 60px 20px;
    text-align: center;
    color: #999999;
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111111;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 2000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .resume-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 2px solid #b91c1c;
    background: #ffffff;
    font-size: 13px;
  }

  .resume-banner button {
    padding: 6px 12px;
    font-size: 12px;
  }

  .resume-dismiss {
    background: #ffffff;
    color: #111111;
    border: 1px solid #cccccc;
  }

  .resume-dismiss:hover {
    background: #f2f2f2;
  }

  /* --- Auto mode banner (compact) --- */

  .auto-panel {
    background: #ffffff;
    border: 2px solid #111111;
    font-size: 12px;
    color: #111111;
  }

  .auto-panel.floating {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 240px;
    z-index: 1000;
    padding: 8px 10px;
  }

  .auto-panel.pip {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 10px;
    border: none;
    border-bottom: 2px solid #111111;
    flex-shrink: 0;
  }

  .auto-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }

  .auto-panel-header strong {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #666666;
  }

  .auto-exit-btn {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    width: 18px;
    height: 18px;
    padding: 0;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }

  .auto-exit-btn:hover {
    background: #111111;
    color: #ffffff;
  }

  .auto-panel-sub {
    font-size: 11px;
    color: #666666;
  }

  .auto-panel-body {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .auto-swatch-col {
    text-align: center;
    width: 46px;
    flex-shrink: 0;
  }

  .auto-swatch-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #999999;
  }

  .auto-swatch {
    width: 100%;
    height: 28px;
    border: 1px solid #cccccc;
  }

  .auto-swatch-current {
    border: 2px solid #111111;
  }

  .auto-swatch-next {
    border: 2px dashed #999999;
  }

  .auto-swatch-hex {
    font-size: 9px;
    font-family: monospace;
  }

  .auto-controls {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .auto-order-row {
    display: flex;
    gap: 4px;
  }

  .auto-order-row select {
    flex: 1;
    min-width: 0;
    padding: 3px 4px;
    font-size: 11px;
  }

  .auto-btn-row {
    display: flex;
    gap: 4px;
  }

  .auto-nav-btn {
    flex: 1;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    padding: 5px;
    font-size: 11px;
    cursor: pointer;
  }

  .auto-nav-btn:hover:not(:disabled) {
    background: #111111;
    color: #ffffff;
  }

  .auto-nav-btn:disabled {
    color: #cccccc;
    border-color: #cccccc;
    cursor: not-allowed;
  }

  .auto-bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .auto-sound-toggle {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .auto-save-btn {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  .auto-save-btn:hover {
    background: #333333;
  }

  .pip-grid-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }
</style>
</head>
<body>

<div id="resumeBannerSlot"></div>

<div class="topbar">
  <div class="toolbar-row">
    <div class="field">
      <label for="imageInput">Image</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="field">
      <label for="widthInput">Grid width (blocks)</label>
      <input type="number" id="widthInput" value="32" min="1" max="256">
    </div>

    <div class="field">
      <label for="heightInput">Grid height (blocks)</label>
      <input type="number" id="heightInput" value="32" min="1" max="256">
    </div>

    <div class="field">
      <label for="cellSizeInput">Square size (px)</label>
      <input type="number" id="cellSizeInput" value="22" min="4" max="64">
    </div>

    <button id="generateBtn" disabled>Generate</button>
    <button id="pipBtn" disabled>Pop out</button>

    <div class="info" id="infoText"></div>
  </div>

  <div class="toolbar-row">
    <div class="field">
      <label for="cornerSelect">Start corner</label>
      <select id="cornerSelect">
        <option value="tl">Top-left</option>
        <option value="tr">Top-right</option>
        <option value="bl">Bottom-left</option>
        <option value="br">Bottom-right</option>
      </select>
    </div>

    <div class="field">
      <label for="directionSelect">Direction</label>
      <select id="directionSelect">
        <option value="horizontal">Row by row</option>
        <option value="vertical">Column by column</option>
      </select>
    </div>

    <button id="startAutoBtn" class="accent-btn" disabled>Start Auto Mode</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="placeholder">Upload an image, set your grid size, and click Generate.</div>
</div>

<div class="toast" id="toast"></div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const cellSizeInput = document.getElementById('cellSizeInput');
  const generateBtn = document.getElementById('generateBtn');
  const pipBtn = document.getElementById('pipBtn');
  const cornerSelect = document.getElementById('cornerSelect');
  const directionSelect = document.getElementById('directionSelect');
  const startAutoBtn = document.getElementById('startAutoBtn');
  const stage = document.getElementById('stage');
  const infoText = document.getElementById('infoText');
  const resumeBannerSlot = document.getElementById('resumeBannerSlot');
  const workCanvas = document.getElementById('workCanvas');
  const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

  const PAD = 6;
  const BORDER = 1;
  const SESSION_KEY = 'pixelGridSession';
  const AUTO_BANNER_H = 96;      // approx height of the compact auto-mode banner
  const BAND_ROWS = 3;           // current row/col + 1 on each side, rest is cropped

  let loadedImage = null;
  let loadedImageDataURL = null;
  let currentGridWrap = null;
  let pipWindow = null;
  let gridDims = { w: 0, h: 0 };

  // all cells, top-left to bottom-right, row-major
  let orderedCells = [];
  // the walk order auto mode currently uses
  let sequence = [];

  let autoModeEnabled = false;
  let startCorner = 'tl';
  let sweepDirection = 'horizontal';
  let autoPointer = -1;
  let currentHex = null;
  let lastLineIndex = null;
  let soundEnabled = true;
  let awaitingReturn = false;
  let watchedWindow = null;
  let autoPanelInstances = [];

  if (!('documentPictureInPicture' in window)) {
    pipBtn.title = 'Picture-in-picture is not supported in this browser (try Chrome or Edge).';
  }

  function getActiveWindow() {
    return pipWindow || window;
  }

  function stripHeightEstimate(cellSize) {
    return gridDims.w > 0 ? cellSize + 4 : 0;
  }

  function pipContentSize(gridW, gridH, cellSize) {
    const gridPixelW = gridW * cellSize + (PAD + BORDER) * 2;
    const stripH = stripHeightEstimate(cellSize);
    const fullGridPixelH = gridH * cellSize + (PAD + BORDER) * 2 + stripH;
    const croppedGridPixelH = Math.min(fullGridPixelH, BAND_ROWS * cellSize + (PAD + BORDER) * 2 + stripH);
    const barH = autoModeEnabled ? AUTO_BANNER_H : 0;
    const gridH_used = autoModeEnabled && sweepDirection === 'horizontal' ? croppedGridPixelH : fullGridPixelH;
    const w = autoModeEnabled ? Math.max(gridPixelW, 280) : gridPixelW;
    return { w, h: gridH_used + barH };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // ---------- clipboard ----------

  async function tryClipboardWrite(win, text) {
    try {
      if (!win.navigator.clipboard || !win.navigator.clipboard.writeText) return false;
      await win.navigator.clipboard.writeText(text);
      return true;
    } catch (err) {
      return false;
    }
  }

  function execCommandCopy(win, text) {
    try {
      const ta = win.document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      win.document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = win.document.execCommand('copy');
      win.document.body.removeChild(ta);
      return ok;
    } catch (err) {
      return false;
    }
  }

  async function copyToClipboard(text, cellWin) {
    if (await tryClipboardWrite(window, text)) return true;
    if (cellWin !== window && await tryClipboardWrite(cellWin, text)) return true;
    if (execCommandCopy(window, text)) return true;
    if (cellWin !== window && execCommandCopy(cellWin, text)) return true;
    return false;
  }

  function showToastIn(win, msg) {
    let t = win.document.querySelector('.toast');
    if (!t) {
      t = win.document.createElement('div');
      t.className = 'toast';
      win.document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1200);
  }

  function speak(text) {
    if (!soundEnabled) return;
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.4;
        u.volume = 0.6;
        window.speechSynthesis.speak(u);
      }
    } catch (err) { /* ignore */ }
  }

  // ---------- auto mode engine ----------

  function buildSequenceFromOrder(corner, direction) {
    const gw = gridDims.w, gh = gridDims.h;
    const xs = []; for (let x = 0; x < gw; x++) xs.push(x);
    const ys = []; for (let y = 0; y < gh; y++) ys.push(y);

    const startLeft = corner === 'tl' || corner === 'bl';
    const startTop = corner === 'tl' || corner === 'tr';

    const orderedXs = startLeft ? xs : xs.slice().reverse();
    const orderedYs = startTop ? ys : ys.slice().reverse();

    const seq = [];
    if (direction === 'vertical') {
      for (const x of orderedXs) for (const y of orderedYs) seq.push(orderedCells[y * gw + x]);
    } else {
      for (const y of orderedYs) for (const x of orderedXs) seq.push(orderedCells[y * gw + x]);
    }
    return seq;
  }

  function applyOrder(corner, direction, keepProgress) {
    startCorner = corner;
    sweepDirection = direction;
    sequence = buildSequenceFromOrder(corner, direction);
    lastLineIndex = null;
    if (keepProgress) {
      const idx = sequence.findIndex(c => !c.classList.contains('used'));
      autoPointer = idx === -1 ? sequence.length - 1 : idx;
    } else {
      autoPointer = 0;
    }
  }

  function getLineIndex(cell) {
    if (!cell) return null;
    return sweepDirection === 'horizontal'
      ? parseInt(cell.dataset.row, 10)
      : parseInt(cell.dataset.col, 10);
  }

  function remainingInLine(pointerIdx) {
    const li = getLineIndex(sequence[pointerIdx]);
    let count = 0;
    for (let i = pointerIdx + 1; i < sequence.length; i++) {
      if (getLineIndex(sequence[i]) === li) count++;
      else break;
    }
    return count;
  }

  function updateNextHighlight() {
    orderedCells.forEach(c => c.classList.remove('next'));
    const nextCell = sequence[autoPointer + 1];
    if (nextCell) nextCell.classList.add('next');
  }

  function activateCell(cell) {
    orderedCells.forEach(c => c.classList.remove('current'));
    cell.classList.add('used');
    cell.classList.add('current');
    currentHex = cell.dataset.hex;

    const li = getLineIndex(cell);
    const isNewLine = lastLineIndex === null || li !== lastLineIndex;
    lastLineIndex = li;

    const remaining = remainingInLine(autoPointer);
    const lineWord = sweepDirection === 'horizontal' ? 'row' : 'column';
    let phrase = isNewLine ? `New ${lineWord}. Copied` : 'Copied';
    if (remaining > 0 && remaining <= 3) phrase += `. ${remaining} left in ${lineWord}`;
    else if (remaining === 0) phrase += `. Last in ${lineWord}`;

    const win = cell.ownerDocument.defaultView;
    copyToClipboard(currentHex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + currentHex) : 'Copy failed');
    });
    speak(phrase);
    updateNextHighlight();
    updateAutoPanels();
    updateAutoViewport();
  }

  function goNext() {
    if (!autoModeEnabled) return;
    if (autoPointer >= sequence.length - 1) {
      showToastIn(getActiveWindow(), 'All done!');
      return;
    }
    autoPointer += 1;
    activateCell(sequence[autoPointer]);
  }

  function goBack() {
    if (!autoModeEnabled) return;
    if (autoPointer <= 0) return;
    autoPointer -= 1;
    activateCell(sequence[autoPointer]);
  }

  function startAuto(corner, direction) {
    if (orderedCells.length === 0) return;
    const keepProgress = orderedCells.some(c => c.classList.contains('used'));
    applyOrder(corner, direction, keepProgress);
    autoModeEnabled = true;
    currentHex = null;
    activateCell(sequence[autoPointer]);
    ensureAutoPanel();
    attachWatcher(getActiveWindow());
    if (pipWindow && currentGridWrap) {
      resizePipTo(gridDims.w, gridDims.h, parseInt(currentGridWrap.dataset.cellSize, 10));
    }
  }

  function stopAuto() {
    const wasEnabled = autoModeEnabled;
    autoModeEnabled = false;
    autoPointer = -1;
    currentHex = null;
    lastLineIndex = null;
    awaitingReturn = false;
    orderedCells.forEach(c => { c.classList.remove('current'); c.classList.remove('next'); });
    detachWatcher(watchedWindow);
    removeAutoPanels();
    updateAutoViewport();
    if (wasEnabled && pipWindow && currentGridWrap) {
      resizePipTo(gridDims.w, gridDims.h, parseInt(currentGridWrap.dataset.cellSize, 10));
    }
  }

  function saveSession() {
    if (!loadedImageDataURL || orderedCells.length === 0) return;
    const usedFlags = orderedCells.map(c => c.classList.contains('used'));
    const cellSize = currentGridWrap ? parseInt(currentGridWrap.dataset.cellSize, 10) : parseInt(cellSizeInput.value, 10);
    const data = {
      imageDataURL: loadedImageDataURL,
      gridW: gridDims.w,
      gridH: gridDims.h,
      cellSize,
      corner: startCorner,
      direction: sweepDirection,
      usedFlags,
      savedAt: Date.now()
    };
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      showToastIn(getActiveWindow(), 'Progress saved');
    } catch (err) {
      showToastIn(getActiveWindow(), 'Could not save progress');
    }
  }

  // ---------- focus-return auto-advance + keyboard shortcuts ----------

  function onBlurHandler() {
    if (autoModeEnabled) awaitingReturn = true;
  }

  function onFocusHandler() {
    if (autoModeEnabled && awaitingReturn) {
      awaitingReturn = false;
      goNext();
    }
  }

  function onKeyHandler(e) {
    if (!autoModeEnabled) return;
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      goNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      goBack();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      const wasPip = pipWindow && watchedWindow === pipWindow;
      stopAuto();
      if (wasPip) pipWindow.close();
    }
  }

  function attachWatcher(win) {
    detachWatcher(watchedWindow);
    watchedWindow = win;
    win.addEventListener('blur', onBlurHandler);
    win.addEventListener('focus', onFocusHandler);
    win.addEventListener('keydown', onKeyHandler);
  }

  function detachWatcher(win) {
    if (!win) return;
    win.removeEventListener('blur', onBlurHandler);
    win.removeEventListener('focus', onFocusHandler);
    win.removeEventListener('keydown', onKeyHandler);
    if (win === watchedWindow) watchedWindow = null;
  }

  // ---------- auto mode panel (mirrored on main page + PiP popup) ----------

  function createAutoPanel(doc, isPip) {
    const root = doc.createElement('div');
    root.className = 'auto-panel' + (isPip ? ' pip' : ' floating');
    root.addEventListener('click', e => e.stopPropagation());

    const header = doc.createElement('div');
    header.className = 'auto-panel-header';
    const title = doc.createElement('strong');
    title.textContent = 'Auto Mode';
    const exitBtn = doc.createElement('button');
    exitBtn.className = 'auto-exit-btn';
    exitBtn.textContent = '✕';
    exitBtn.title = 'Exit auto mode';
    header.appendChild(title);
    header.appendChild(exitBtn);

    const gridInfoEl = doc.createElement('div');
    gridInfoEl.className = 'auto-panel-sub';
    const progressEl = doc.createElement('div');
    progressEl.className = 'auto-panel-sub';

    const body = doc.createElement('div');
    body.className = 'auto-panel-body';

    const curCol = doc.createElement('div');
    curCol.className = 'auto-swatch-col';
    const curLabel = doc.createElement('div');
    curLabel.className = 'auto-swatch-label';
    curLabel.textContent = 'Just copied';
    const currentSwatch = doc.createElement('div');
    currentSwatch.className = 'auto-swatch auto-swatch-current';
    const currentHexEl = doc.createElement('div');
    currentHexEl.className = 'auto-swatch-hex';
    curCol.appendChild(curLabel);
    curCol.appendChild(currentSwatch);
    curCol.appendChild(currentHexEl);

    const nextCol = doc.createElement('div');
    nextCol.className = 'auto-swatch-col';
    const nextLabel = doc.createElement('div');
    nextLabel.className = 'auto-swatch-label';
    nextLabel.textContent = 'Up next';
    const nextSwatch = doc.createElement('div');
    nextSwatch.className = 'auto-swatch auto-swatch-next';
    const nextHexEl = doc.createElement('div');
    nextHexEl.className = 'auto-swatch-hex';
    nextCol.appendChild(nextLabel);
    nextCol.appendChild(nextSwatch);
    nextCol.appendChild(nextHexEl);

    const controls = doc.createElement('div');
    controls.className = 'auto-controls';

    const orderRow = doc.createElement('div');
    orderRow.className = 'auto-order-row';
    const pCorner = doc.createElement('select');
    [['tl', 'Top-left'], ['tr', 'Top-right'], ['bl', 'Bottom-left'], ['br', 'Bottom-right']].forEach(([v, l]) => {
      const o = doc.createElement('option'); o.value = v; o.textContent = l; pCorner.appendChild(o);
    });
    const pDirection = doc.createElement('select');
    [['horizontal', 'Row by row'], ['vertical', 'Column by column']].forEach(([v, l]) => {
      const o = doc.createElement('option'); o.value = v; o.textContent = l; pDirection.appendChild(o);
    });
    orderRow.appendChild(pCorner);
    orderRow.appendChild(pDirection);

    const btnRow = doc.createElement('div');
    btnRow.className = 'auto-btn-row';
    const backBtn = doc.createElement('button');
    backBtn.className = 'auto-nav-btn';
    backBtn.textContent = '← Back';
    const nextBtn = doc.createElement('button');
    nextBtn.className = 'auto-nav-btn';
    nextBtn.textContent = 'Next →';
    btnRow.appendChild(backBtn);
    btnRow.appendChild(nextBtn);

    const bottomRow = doc.createElement('div');
    bottomRow.className = 'auto-bottom-row';
    const soundLabel = doc.createElement('label');
    soundLabel.className = 'auto-sound-toggle';
    const soundToggle = doc.createElement('input');
    soundToggle.type = 'checkbox';
    soundLabel.appendChild(soundToggle);
    soundLabel.appendChild(doc.createTextNode(' Sound'));
    const saveBtn = doc.createElement('button');
    saveBtn.className = 'auto-save-btn';
    saveBtn.textContent = 'Save & Exit';
    bottomRow.appendChild(soundLabel);
    bottomRow.appendChild(saveBtn);

    controls.appendChild(orderRow);
    controls.appendChild(btnRow);
    controls.appendChild(bottomRow);

    body.appendChild(curCol);
    body.appendChild(nextCol);
    body.appendChild(controls);

    root.appendChild(header);
    root.appendChild(gridInfoEl);
    root.appendChild(progressEl);
    root.appendChild(body);

    exitBtn.addEventListener('click', () => {
      const wasPip = pipWindow && doc === pipWindow.document;
      stopAuto();
      if (wasPip) pipWindow.close();
    });
    backBtn.addEventListener('click', goBack);
    nextBtn.addEventListener('click', goNext);
    saveBtn.addEventListener('click', () => {
      saveSession();
      const wasPip = pipWindow && doc === pipWindow.document;
      stopAuto();
      if (wasPip) pipWindow.close();
    });
    soundToggle.addEventListener('change', () => {
      soundEnabled = soundToggle.checked;
      updateAutoPanels();
    });
    pCorner.addEventListener('change', () => {
      applyOrder(pCorner.value, sweepDirection, true);
      activateCell(sequence[autoPointer]);
    });
    pDirection.addEventListener('change', () => {
      applyOrder(startCorner, pDirection.value, true);
      activateCell(sequence[autoPointer]);
      if (pipWindow) resizePipTo(gridDims.w, gridDims.h, parseInt(currentGridWrap.dataset.cellSize, 10));
    });

    return {
      doc, root, gridInfoEl, progressEl, currentSwatch, currentHexEl,
      nextSwatch, nextHexEl, cornerSelect: pCorner, directionSelect: pDirection,
      backBtn, nextBtn, soundToggle
    };
  }

  function ensureAutoPanel() {
    const win = getActiveWindow();
    autoPanelInstances = autoPanelInstances.filter(p => {
      if (p.doc !== win.document) { p.root.remove(); return false; }
      return true;
    });
    if (autoPanelInstances.length === 0) {
      const isPip = win === pipWindow;
      const panel = createAutoPanel(win.document, isPip);
      if (isPip) {
        win.document.body.insertBefore(panel.root, win.document.body.firstChild);
      } else {
        win.document.body.appendChild(panel.root);
      }
      autoPanelInstances.push(panel);
    }
    updateAutoPanels();
  }

  function removeAutoPanels() {
    autoPanelInstances.forEach(p => p.root.remove());
    autoPanelInstances = [];
  }

  function updateAutoPanels() {
    autoPanelInstances = autoPanelInstances.filter(p => p.root.isConnected);
    if (!sequence.length || autoPointer < 0) return;
    const li = getLineIndex(sequence[autoPointer]);
    const lineWord = sweepDirection === 'horizontal' ? 'Row' : 'Col';
    const lineTotal = sweepDirection === 'horizontal' ? gridDims.h : gridDims.w;
    const remaining = remainingInLine(autoPointer);
    const nextCell = sequence[autoPointer + 1];
    const nextHex = nextCell ? nextCell.dataset.hex : null;

    autoPanelInstances.forEach(p => {
      p.gridInfoEl.textContent = `${lineWord} ${li + 1}/${lineTotal} • Square ${autoPointer + 1}/${sequence.length}`;
      p.progressEl.textContent = remaining > 0
        ? `${remaining} left in ${sweepDirection === 'horizontal' ? 'row' : 'column'}`
        : `Last in ${sweepDirection === 'horizontal' ? 'row' : 'column'}`;
      p.currentSwatch.style.background = currentHex || '#ffffff';
      p.currentHexEl.textContent = currentHex || '—';
      p.nextSwatch.style.background = nextHex || '#ffffff';
      p.nextHexEl.textContent = nextHex || '—';
      p.backBtn.disabled = autoPointer <= 0;
      p.nextBtn.disabled = autoPointer >= sequence.length - 1;
      p.cornerSelect.value = startCorner;
      p.directionSelect.value = sweepDirection;
      p.soundToggle.checked = soundEnabled;
    });
  }

  // ---------- auto-mode viewport cropping + darkening ----------

  function ensureOverlayEls(gridWrap) {
    let above = gridWrap.querySelector('.row-dim.dim-above');
    let below = gridWrap.querySelector('.row-dim.dim-below');
    if (!above) {
      above = gridWrap.ownerDocument.createElement('div');
      above.className = 'row-dim dim-above';
      gridWrap.appendChild(above);
    }
    if (!below) {
      below = gridWrap.ownerDocument.createElement('div');
      below.className = 'row-dim dim-below';
      gridWrap.appendChild(below);
    }
    return { above, below };
  }

  function updateAutoViewport() {
    if (!currentGridWrap) return;
    const { above, below } = ensureOverlayEls(currentGridWrap);
    const grid = currentGridWrap.querySelector('.grid');
    const gridTop = grid ? grid.offsetTop : 0;
    const gridLeft = grid ? grid.offsetLeft : 0;

    if (!autoModeEnabled || !sequence.length || autoPointer < 0) {
      currentGridWrap.style.overflow = '';
      currentGridWrap.style.height = '';
      currentGridWrap.style.width = '';
      currentGridWrap.scrollTop = 0;
      currentGridWrap.scrollLeft = 0;
      above.style.display = 'none';
      below.style.display = 'none';
      return;
    }

    const gw = gridDims.w, gh = gridDims.h;
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    const cell = sequence[autoPointer];

    if (sweepDirection === 'horizontal') {
      const row = parseInt(cell.dataset.row, 10);
      const viewH = BAND_ROWS * cellSize + PAD * 2 + BORDER * 2;
      currentGridWrap.style.overflowY = 'hidden';
      currentGridWrap.style.overflowX = 'auto';
      currentGridWrap.style.width = '';
      currentGridWrap.style.height = Math.min(viewH, gh * cellSize + PAD * 2 + BORDER * 2) + 'px';
      currentGridWrap.scrollTop = Math.max(0, gridTop + (row - 1) * cellSize);

      if (row > 0) {
        above.style.display = 'block';
        above.style.left = gridLeft + 'px';
        above.style.top = (gridTop + (row - 1) * cellSize) + 'px';
        above.style.width = (gw * cellSize) + 'px';
        above.style.height = cellSize + 'px';
      } else above.style.display = 'none';

      if (row < gh - 1) {
        below.style.display = 'block';
        below.style.left = gridLeft + 'px';
        below.style.top = (gridTop + (row + 1) * cellSize) + 'px';
        below.style.width = (gw * cellSize) + 'px';
        below.style.height = cellSize + 'px';
      } else below.style.display = 'none';
    } else {
      const col = parseInt(cell.dataset.col, 10);
      const viewW = BAND_ROWS * cellSize + PAD * 2 + BORDER * 2;
      currentGridWrap.style.overflowX = 'hidden';
      currentGridWrap.style.overflowY = 'auto';
      currentGridWrap.style.height = '';
      currentGridWrap.style.width = Math.min(viewW, gw * cellSize + PAD * 2 + BORDER * 2) + 'px';
      currentGridWrap.scrollLeft = Math.max(0, gridLeft + (col - 1) * cellSize);

      if (col > 0) {
        above.style.display = 'block';
        above.style.top = gridTop + 'px';
        above.style.left = (gridLeft + (col - 1) * cellSize) + 'px';
        above.style.height = (gh * cellSize) + 'px';
        above.style.width = cellSize + 'px';
      } else above.style.display = 'none';

      if (col < gw - 1) {
        below.style.display = 'block';
        below.style.top = gridTop + 'px';
        below.style.left = (gridLeft + (col + 1) * cellSize) + 'px';
        below.style.height = (gh * cellSize) + 'px';
        below.style.width = cellSize + 'px';
      } else below.style.display = 'none';
    }
  }

  // ---------- grid mounting + PiP ----------

  function resizePipTo(gridW, gridH, cellSize) {
    if (!pipWindow) return;
    const size = pipContentSize(gridW, gridH, cellSize);
    try { pipWindow.resizeTo(size.w, size.h); } catch (err) { /* ignore */ }
  }

  function applyCellSize(gridWrap, cellSize) {
    const grid = gridWrap.querySelector('.grid');
    const gw = gridDims.w, gh = gridDims.h;
    if (grid) {
      grid.style.gridTemplateColumns = `repeat(${gw}, ${cellSize}px)`;
      grid.style.gridTemplateRows = `repeat(${gh}, ${cellSize}px)`;
      grid.querySelectorAll('.cell').forEach(c => {
        c.style.width = cellSize + 'px';
        c.style.height = cellSize + 'px';
      });
    }
    const strip = gridWrap.querySelector('.marker-strip');
    if (strip) {
      strip.querySelectorAll('.marker-square').forEach(s => {
        s.style.width = cellSize + 'px';
        s.style.height = cellSize + 'px';
      });
    }
    gridWrap.dataset.cellSize = cellSize;
  }

  function mountGrid(gridWrap, gridW, gridH, cellSize) {
    currentGridWrap = gridWrap;
    gridWrap.dataset.gridW = gridW;
    gridWrap.dataset.gridH = gridH;
    gridWrap.dataset.cellSize = cellSize;

    if (pipWindow) {
      let area = pipWindow.document.querySelector('.pip-grid-area');
      if (!area) {
        area = pipWindow.document.createElement('div');
        area.className = 'pip-grid-area';
        pipWindow.document.body.appendChild(area);
      }
      area.innerHTML = '';
      area.appendChild(gridWrap);
      resizePipTo(gridW, gridH, cellSize);
    } else {
      stage.innerHTML = '';
      stage.appendChild(gridWrap);
    }

    pipBtn.disabled = !('documentPictureInPicture' in window);
    startAutoBtn.disabled = false;
    updateAutoViewport();
  }

  async function openPip() {
    if (pipWindow) return pipWindow;
    if (!('documentPictureInPicture' in window)) return null;
    if (!currentGridWrap) return null;

    const gridW = parseInt(currentGridWrap.dataset.gridW, 10);
    const gridH = parseInt(currentGridWrap.dataset.gridH, 10);
    let cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);

    // Auto-fit the square size to the available screen space so the whole
    // image is visible without scrolling, keeping the grid's aspect ratio.
    const availW = (window.screen ? window.screen.availWidth : 1200) * 0.85;
    const availH = (window.screen ? window.screen.availHeight : 800) * 0.8;
    const extra = (PAD + BORDER) * 2 + stripHeightEstimate(cellSize) + (autoModeEnabled ? AUTO_BANNER_H : 0);
    const maxCellW = Math.floor((availW - (PAD + BORDER) * 2) / gridW);
    const maxCellH = Math.floor((availH - extra) / gridH);
    const fitted = Math.max(4, Math.min(cellSize, maxCellW, maxCellH, 64));
    if (fitted !== cellSize && fitted > 0) {
      cellSize = fitted;
      applyCellSize(currentGridWrap, cellSize);
    }

    const size = pipContentSize(gridW, gridH, cellSize);

    pipWindow = await documentPictureInPicture.requestWindow({ width: size.w, height: size.h });

    for (const styleEl of document.querySelectorAll('style')) {
      pipWindow.document.head.appendChild(styleEl.cloneNode(true));
    }

    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.style.background = '#ffffff';
    pipWindow.document.body.style.overflow = 'hidden';
    pipWindow.document.body.style.display = 'flex';
    pipWindow.document.body.style.flexDirection = 'column';
    pipWindow.document.body.style.height = '100vh';

    mountGrid(currentGridWrap, gridW, gridH, cellSize);

    const wasAuto = autoModeEnabled;
    if (wasAuto) {
      attachWatcher(pipWindow);
      ensureAutoPanel();
    }

    pipWindow.addEventListener('pagehide', () => {
      const stillAuto = autoModeEnabled;
      pipWindow = null;
      stage.innerHTML = '';
      stage.appendChild(currentGridWrap);
      if (stillAuto) {
        attachWatcher(window);
        ensureAutoPanel();
      }
      updateAutoViewport();
    }, { once: true });

    return pipWindow;
  }

  // ---------- cell click handling ----------

  function handleCellClick(index) {
    const cell = orderedCells[index];

    if (autoModeEnabled) {
      // In auto mode, a click anywhere just advances to the next square —
      // no need to hit the exact cell.
      goNext();
      return;
    }

    const hex = cell.dataset.hex;
    const win = cell.ownerDocument.defaultView;
    copyToClipboard(hex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + hex) : 'Copy failed');
    });
    cell.classList.toggle('used');
  }

  // ---------- image + grid building ----------

  function buildGridFromImage(img, gridW, gridH, cellSize) {
    workCanvas.width = gridW;
    workCanvas.height = gridH;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, gridW, gridH);

    let pixelData;
    try {
      pixelData = ctx.getImageData(0, 0, gridW, gridH).data;
    } catch (err) {
      return null;
    }

    orderedCells = [];
    gridDims = { w: gridW, h: gridH };

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    // RGB alignment reference squares: red flush with the right edge,
    // green next, blue next, going right-to-left.
    const stripCount = Math.min(3, gridW);
    if (stripCount > 0) {
      const stripEl = document.createElement('div');
      stripEl.className = 'marker-strip';
      const colors = ['blue', 'green', 'red'].slice(3 - stripCount);
      colors.forEach(color => {
        const sq = document.createElement('div');
        sq.className = 'marker-square marker-' + color;
        sq.style.width = cellSize + 'px';
        sq.style.height = cellSize + 'px';
        sq.title = color[0].toUpperCase() + color.slice(1) + ' alignment marker — click to mark placed';
        sq.addEventListener('click', () => sq.classList.toggle('checked'));
        stripEl.appendChild(sq);
      });
      gridWrap.appendChild(stripEl);
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;

    // If there's no single center square (even dimension), mark the center two.
    const centerXs = gridW % 2 === 1 ? [(gridW - 1) / 2] : [gridW / 2 - 1, gridW / 2];
    const centerYs = gridH % 2 === 1 ? [(gridH - 1) / 2] : [gridH / 2 - 1, gridH / 2];

    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const idx = (y * gridW + x) * 4;
        const r = pixelData[idx], g = pixelData[idx + 1], b = pixelData[idx + 2];
        const hex = rgbToHex(r, g, b);

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.background = hex;
        cell.title = hex;
        cell.dataset.hex = hex;
        cell.dataset.row = y;
        cell.dataset.col = x;

        if (centerXs.includes(x)) {
          const tick = document.createElement('span');
          tick.className = 'center-tick center-tick-v';
          cell.appendChild(tick);
        }
        if (centerYs.includes(y)) {
          const tick = document.createElement('span');
          tick.className = 'center-tick center-tick-h';
          cell.appendChild(tick);
        }

        const cellIndex = orderedCells.length;
        cell.addEventListener('click', () => handleCellClick(cellIndex));
        orderedCells.push(cell);

        grid.appendChild(cell);
      }
    }

    gridWrap.appendChild(grid);

    gridWrap.addEventListener('click', (e) => {
      if (autoModeEnabled && e.target === gridWrap) goNext();
    });

    return gridWrap;
  }

  // ---------- resume from localStorage ----------

  function offerResume() {
    let raw;
    try { raw = localStorage.getItem(SESSION_KEY); } catch (err) { return; }
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (err) { return; }
    if (!data || !data.imageDataURL || !data.gridW || !data.gridH) return;

    const usedCount = Array.isArray(data.usedFlags) ? data.usedFlags.filter(Boolean).length : 0;
    const total = data.gridW * data.gridH;

    const banner = document.createElement('div');
    banner.className = 'resume-banner';

    const text = document.createElement('span');
    text.textContent = `Saved session found — ${data.gridW} × ${data.gridH}, ${usedCount} of ${total} placed.`;

    const resumeBtn = document.createElement('button');
    resumeBtn.textContent = 'Resume';

    const dismissBtn = document.createElement('button');
    dismissBtn.className = 'resume-dismiss';
    dismissBtn.textContent = 'Dismiss';

    resumeBtn.addEventListener('click', () => {
      resumeSession(data);
      banner.remove();
    });
    dismissBtn.addEventListener('click', () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
      banner.remove();
    });

    banner.appendChild(text);
    banner.appendChild(resumeBtn);
    banner.appendChild(dismissBtn);
    resumeBannerSlot.appendChild(banner);
  }

  function resumeSession(data) {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      loadedImageDataURL = data.imageDataURL;
      generateBtn.disabled = false;
      widthInput.value = data.gridW;
      heightInput.value = data.gridH;
      cellSizeInput.value = data.cellSize;

      stopAuto();
      const gridWrap = buildGridFromImage(img, data.gridW, data.gridH, data.cellSize);
      if (!gridWrap) return;

      if (Array.isArray(data.usedFlags)) {
        data.usedFlags.forEach((used, i) => {
          if (used && orderedCells[i]) orderedCells[i].classList.add('used');
        });
      }

      mountGrid(gridWrap, data.gridW, data.gridH, data.cellSize);
      infoText.textContent = `${data.gridW} × ${data.gridH} = ${data.gridW * data.gridH} blocks`;
      cornerSelect.value = data.corner || 'tl';
      directionSelect.value = data.direction || 'horizontal';

      startAuto(data.corner || 'tl', data.direction || 'horizontal');
    };
    img.src = data.imageDataURL;
  }

  // ---------- events ----------

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) {
      loadedImage = null;
      loadedImageDataURL = null;
      generateBtn.disabled = true;
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        loadedImageDataURL = e.target.result;
        generateBtn.disabled = false;

        const w = parseInt(widthInput.value, 10) || 32;
        const ratio = img.height / img.width;
        heightInput.value = Math.max(1, Math.round(w * ratio));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  widthInput.addEventListener('change', () => {
    if (!loadedImage) return;
    const w = parseInt(widthInput.value, 10) || 32;
    const ratio = loadedImage.height / loadedImage.width;
    heightInput.value = Math.max(1, Math.round(w * ratio));
  });

  [widthInput, heightInput, cellSizeInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !generateBtn.disabled) generateBtn.click();
    });
  });

  generateBtn.addEventListener('click', () => {
    if (!loadedImage) return;

    const gridW = Math.max(1, Math.min(256, parseInt(widthInput.value, 10) || 32));
    const gridH = Math.max(1, Math.min(256, parseInt(heightInput.value, 10) || 32));
    const cellSize = Math.max(4, Math.min(64, parseInt(cellSizeInput.value, 10) || 22));

    stopAuto();
    const gridWrap = buildGridFromImage(loadedImage, gridW, gridH, cellSize);
    if (!gridWrap) {
      stage.innerHTML = '<div class="placeholder">Could not read image data (possibly a cross-origin image).</div>';
      return;
    }
    mountGrid(gridWrap, gridW, gridH, cellSize);
    infoText.textContent = `${gridW} × ${gridH} = ${gridW * gridH} blocks`;
  });

  pipBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if (!('documentPictureInPicture' in window)) {
      showToastIn(window, 'PiP not supported in this browser');
      return;
    }
    await openPip();
  });

  startAutoBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if ('documentPictureInPicture' in window) {
      await openPip();
    }
    startAuto(cornerSelect.value, directionSelect.value);
  });

  // ---------- init ----------

  offerResume();
</script>

</body>
</html>
