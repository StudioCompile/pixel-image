<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Grid</title>
<style>
  :root {
    --ink: #14161a;
    --ink-soft: #6b7076;
    --line: #e2e3e6;
    --paper: #ffffff;
    --accent: #b91c1c;
    --accent-dark: #7f1414;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }

  .app-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .app-header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .app-header span {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  input[type="file"], input[type="number"] {
    border: 1px solid #cfd1d4;
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
  }
  input[type="number"] { width: 84px; }
  input[type="number"]:focus, input[type="file"]:focus { border-color: var(--ink); }

  input[type="file"]::file-selector-button {
    border: 1px solid var(--ink);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
    padding: 5px 9px;
    margin-right: 8px;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: var(--ink); color: #fff; }

  button {
    border: 1px solid var(--ink);
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    height: fit-content;
  }
  button:hover { background: #2a2d33; }
  button:disabled { background: #d8d9db; border-color: #d8d9db; color: #fff; cursor: not-allowed; }

  .accent-btn { background: var(--accent); border-color: var(--accent); }
  .accent-btn:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }

  .ghost-btn { background: var(--paper); color: var(--ink); }
  .ghost-btn:hover:not(:disabled) { background: #f2f2f3; }

  .info { font-size: 12px; color: var(--ink-soft); margin-left: auto; align-self: center; }

  .stage { padding: 20px; }

  .grid-wrap {
    display: inline-block;
    position: relative;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
    background: var(--paper);
    overflow: hidden;
  }

  .calibration-row { display: grid; line-height: 0; }
  .calibration-cell { position: relative; }
  .calibration-cell::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
  }
  .center-mark-cell {
    box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 0 4px #111111;
  }

  .grid { display: grid; line-height: 0; }

  .cell { position: relative; width: 22px; height: 22px; cursor: pointer; }

  .cell:hover::after {
    content: "";
    position: absolute;
    inset: 0;
    outline: 2px solid var(--ink);
    outline-offset: -2px;
  }

  .cell.used { filter: grayscale(1) brightness(1.15); }
  .cell.used::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.35);
  }
  .cell.used::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: var(--check-color, #111111);
    text-shadow: 0 0 2px #fff, 0 0 2px #fff;
  }

  .cell.current { outline: 3px solid var(--ink); outline-offset: -3px; z-index: 3; }
  .cell.next-preview {
    outline: 1px solid #ffffff;
    outline-offset: -3px;
    box-shadow: inset 0 0 0 1px #000000;
    z-index: 3;
  }
  .cell.start-marker {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
    z-index: 4;
  }
  .cell.start-marker::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 5px rgba(185, 28, 28, 0.35);
  }

  .placeholder { padding: 70px 20px; text-align: center; color: #a6a8ab; font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .resume-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 2px solid var(--accent);
    background: var(--paper);
    font-size: 13px;
  }
  .resume-banner button { padding: 6px 12px; font-size: 12px; }
  .resume-dismiss { background: var(--paper); color: var(--ink); border: 1px solid #cfd1d4; }
  .resume-dismiss:hover { background: #f2f2f2; }

  /* ---------------- popup idle controls (auto mode not running) ---------------- */

  .pip-idle-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    font-size: 12px;
  }
  .pip-idle-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .pip-idle-info { color: var(--ink-soft); }

  .start-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border: 1px solid #cfd1d4;
    border-radius: 6px;
    background: #fafafa;
  }
  .start-indicator.picked { border-color: var(--accent); background: #fdf1f1; }
  .start-indicator-text { color: var(--ink-soft); }
  .start-indicator.picked .start-indicator-text { color: var(--accent); font-weight: 600; }
  .start-clear-btn {
    width: 18px;
    height: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--ink-soft);
    border: none;
    border-radius: 50%;
    font-size: 11px;
    cursor: pointer;
  }
  .start-clear-btn:hover { background: #e6e6e7; color: var(--ink); }

  .dir-picker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dir-picker-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-right: 2px; }
  .dir-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .dir-btn:hover { background: #2a2d33; }
  .dir-btn .glyph { font-size: 14px; }

  /* ---------------- auto mode click-to-copy overlay ---------------- */

  .auto-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    border: 3px solid var(--accent);
    box-sizing: border-box;
    z-index: 50;
    user-select: none;
  }
  .auto-overlay .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(10,10,12,0.62) 0, rgba(10,10,12,0.0) 130px);
    pointer-events: none;
  }
  .auto-overlay-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
  }
  .auto-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.85);
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
  }
  .auto-header-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }
  .auto-progress-text { color: #ffffff; font-size: 12px; font-weight: 700; }
  .auto-ago-text { color: rgba(255,255,255,0.7); font-size: 10px; }

  .auto-header-spacer { flex: 1; }

  .auto-mini-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.12);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
  }
  .auto-mini-btn:hover { background: rgba(255,255,255,0.28); }
  .auto-mini-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .auto-mini-btn.close { background: rgba(0,0,0,0.35); }
  .auto-mini-btn.close:hover { background: var(--accent); border-color: var(--accent); }
  .auto-mini-btn.square { border-radius: 6px; }
  .auto-mini-btn.active { background: var(--accent); border-color: var(--accent); }
  .auto-mini-btn.active:hover { background: var(--accent-dark); }

  .auto-click-area {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  .hover-zone {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 96px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 2px dashed rgba(255,255,255,0.85);
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: center;
    z-index: 4;
  }
  .hover-zone.active { display: flex; }
  .hover-zone .hz-icon { font-size: 20px; font-weight: 400; }

  .auto-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 3;
  }
  .auto-flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .auto-footer {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .auto-footer button {
    background: rgba(20,20,22,0.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .auto-footer button:hover { background: rgba(20,20,22,0.8); }
  .auto-footer button:disabled { opacity: 0.3; cursor: not-allowed; }

  .pip-click-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>Pixel Grid</h1>
  <span>image → click-to-copy color grid, pop it out and let auto mode do the counting</span>
</div>

<div id="resumeBannerSlot"></div>

<div class="toolbar-row">
  <div class="field">
    <label for="imageInput">Image</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>
  <div class="field">
    <label for="widthInput">Width (blocks)</label>
    <input type="number" id="widthInput" value="32" min="1" max="256">
  </div>
  <div class="field">
    <label for="heightInput">Height (blocks)</label>
    <input type="number" id="heightInput" value="32" min="1" max="256">
  </div>
  <div class="field">
    <label for="cellSizeInput">Preview size (px)</label>
    <input type="number" id="cellSizeInput" value="22" min="4" max="64">
  </div>
  <button id="generateBtn" disabled>Generate</button>
  <button id="pipBtn" class="ghost-btn" disabled>Pop out</button>
  <div class="info" id="infoText"></div>
</div>

<div class="stage" id="stage">
  <div class="placeholder">Upload an image, set your grid size, and click Generate.</div>
</div>

<div class="toast" id="toast"></div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const cellSizeInput = document.getElementById('cellSizeInput');
  const generateBtn = document.getElementById('generateBtn');
  const pipBtn = document.getElementById('pipBtn');
  const stage = document.getElementById('stage');
  const infoText = document.getElementById('infoText');
  const resumeBannerSlot = document.getElementById('resumeBannerSlot');
  const workCanvas = document.getElementById('workCanvas');
  const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

  const PAD = 6;
  const BORDER = 1;
  const SESSION_KEY = 'pixelGridSession';
  const PIP_DEFAULT_W = 560;
  const PIP_DEFAULT_H = 480;
  const RGB_COLORS = ['#ff0000', '#00ff00', '#0000ff'];
  const RGB_NAMES = ['RED', 'GREEN', 'BLUE'];

  let loadedImage = null;
  let loadedImageDataURL = null;
  let currentGridWrap = null;
  let pipWindow = null;
  let pipIdleBarEl = null;
  let gridDims = { w: 0, h: 0 };

  // every cell in raster (row-major) order — used for building the grid and pixel lookup
  let allCells = [];
  // the order auto mode steps through, derived from allCells + the chosen start direction
  let autoSequence = [];

  let direction = 'down'; // 'down' | 'up' | 'right' | 'left'
  let startCell = null; // a cell from allCells, or null for the default edge
  let autoModeEnabled = false;
  let autoPointer = -1;
  let currentHex = null;
  let previousHex = null;
  let lastLineKey = null;
  let lastCopiedAt = null;
  let soundEnabled = true;
  let hoverModeEnabled = false; // advance by hovering the small box, no click/focus needed
  let awaitingReturn = false;
  let watchedWindow = null;
  let liveTimerId = null;

  let overlayEls = null; // refs to the live auto-overlay DOM, when auto mode is running

  if (!('documentPictureInPicture' in window)) {
    pipBtn.title = 'Picture-in-picture is not supported in this browser (try Chrome or Edge).';
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // red starts at the rightmost column, then green, then blue, repeating leftward.
  // this is purely a visual alignment reference — it is never copied to the clipboard.
  function bandIndexFor(x, gridW) {
    return (gridW - 1 - x) % 3;
  }
  function bandColorFor(x, gridW) { return RGB_COLORS[bandIndexFor(x, gridW)]; }
  function bandNameFor(x, gridW) { return RGB_NAMES[bandIndexFor(x, gridW)]; }

  // ---------- clipboard ----------

  async function tryClipboardWrite(win, text) {
    try {
      if (!win.navigator.clipboard || !win.navigator.clipboard.writeText) return false;
      await win.navigator.clipboard.writeText(text);
      return true;
    } catch (err) { return false; }
  }

  function execCommandCopy(win, text) {
    try {
      const ta = win.document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      win.document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = win.document.execCommand('copy');
      win.document.body.removeChild(ta);
      return ok;
    } catch (err) { return false; }
  }

  async function copyToClipboard(text, cellWin) {
    if (await tryClipboardWrite(window, text)) return true;
    if (cellWin !== window && await tryClipboardWrite(cellWin, text)) return true;
    if (execCommandCopy(window, text)) return true;
    if (cellWin !== window && execCommandCopy(cellWin, text)) return true;
    return false;
  }

  function showToastIn(win, msg) {
    let t = win.document.querySelector('.toast');
    if (!t) {
      t = win.document.createElement('div');
      t.className = 'toast';
      win.document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1200);
  }

  // quick, short utterances so auto mode doesn't fall behind clicking
  function speak(text) {
    if (!soundEnabled) return;
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 2.0;
        u.pitch = 1;
        u.volume = 0.6;
        window.speechSynthesis.speak(u);
      }
    } catch (err) { /* ignore */ }
  }

  function formatAgo(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 1) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60) + 's ago';
  }

  // ---------- auto mode ordering ----------

  function isRowDirection() { return direction === 'down' || direction === 'up'; }

  // Builds the traversal order from the picked start block (or a grid edge, if
  // none was picked) continuing in the chosen direction. Rows/columns on the far
  // side of the start line are left out entirely — that's what lets you resume
  // partway through a grid you already started elsewhere.
  function computeAutoSequence() {
    const gridW = gridDims.w, gridH = gridDims.h;
    const seq = [];
    if (isRowDirection()) {
      const startRow = startCell ? +startCell.dataset.gy : (direction === 'down' ? 0 : gridH - 1);
      const rows = [];
      if (direction === 'down') { for (let y = startRow; y < gridH; y++) rows.push(y); }
      else { for (let y = startRow; y >= 0; y--) rows.push(y); }
      const byRow = new Map();
      allCells.forEach(c => {
        const y = +c.dataset.gy;
        if (!byRow.has(y)) byRow.set(y, []);
        byRow.get(y).push(c);
      });
      rows.forEach(y => {
        const rowCells = (byRow.get(y) || []).slice().sort((a, b) => +a.dataset.gx - +b.dataset.gx);
        seq.push(...rowCells);
      });
    } else {
      const startCol = startCell ? +startCell.dataset.gx : (direction === 'right' ? 0 : gridW - 1);
      const cols = [];
      if (direction === 'right') { for (let x = startCol; x < gridW; x++) cols.push(x); }
      else { for (let x = startCol; x >= 0; x--) cols.push(x); }
      const byCol = new Map();
      allCells.forEach(c => {
        const x = +c.dataset.gx;
        if (!byCol.has(x)) byCol.set(x, []);
        byCol.get(x).push(c);
      });
      cols.forEach(x => {
        const colCells = (byCol.get(x) || []).slice().sort((a, b) => +a.dataset.gy - +b.dataset.gy);
        seq.push(...colCells);
      });
    }
    return seq;
  }

  function lineKeyOf(cell) { return isRowDirection() ? cell.dataset.gy : cell.dataset.gx; }

  // ---------- stepping through cells ----------

  function activateCell(cell) {
    autoSequence.forEach(c => c.classList.remove('current', 'next-preview'));
    if (currentHex !== null) previousHex = currentHex;
    cell.classList.add('used');
    cell.classList.add('current');
    currentHex = cell.dataset.hex;
    lastCopiedAt = Date.now();

    const gx = +cell.dataset.gx;
    const gridW = gridDims.w;
    const bandName = bandNameFor(gx, gridW);
    const bandColor = bandColorFor(gx, gridW);

    if (autoPointer + 1 < autoSequence.length) {
      autoSequence[autoPointer + 1].classList.add('next-preview');
    }

    const win = cell.ownerDocument.defaultView;
    copyToClipboard(currentHex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + currentHex) : 'Copy failed');
    });

    flashBand(bandName, bandColor);

    const key = lineKeyOf(cell);
    if (lastLineKey !== null && key !== lastLineKey) {
      speak(isRowDirection() ? 'New row, ' + bandName : 'New column, ' + bandName);
    } else {
      speak(bandName);
    }
    lastLineKey = key;

    updateOverlay();
  }

  function goNext() {
    if (!autoModeEnabled) return;
    if (autoPointer >= autoSequence.length - 1) {
      showToastIn(pipWindow || window, 'All done!');
      return;
    }
    autoPointer += 1;
    activateCell(autoSequence[autoPointer]);
  }

  function goBack() {
    if (!autoModeEnabled) return;
    if (autoPointer <= 0) return;
    autoPointer -= 1;
    activateCell(autoSequence[autoPointer]);
  }

  function startAuto() {
    if (allCells.length === 0 || !pipWindow) return;
    removePipIdleBar();
    if (startCell) startCell.classList.remove('start-marker');
    autoSequence = computeAutoSequence();
    const keepProgress = autoSequence.some(c => c.classList.contains('used'));
    autoPointer = keepProgress ? autoSequence.findIndex(c => !c.classList.contains('used')) : 0;
    if (autoPointer === -1) autoPointer = autoSequence.length - 1;
    autoModeEnabled = true;
    currentHex = null;
    previousHex = null;
    lastLineKey = null;
    buildAutoOverlay();
    activateCell(autoSequence[autoPointer]);
    attachWatcher(pipWindow);
    startLiveTimer();
  }

  // clears progress for the current run only (the cells in autoSequence) and
  // jumps back to its first cell — the start block and direction stay the same
  function restartAuto() {
    if (!autoModeEnabled) return;
    autoSequence.forEach(c => c.classList.remove('used', 'current', 'next-preview'));
    autoPointer = 0;
    currentHex = null;
    previousHex = null;
    lastLineKey = null;
    activateCell(autoSequence[0]);
  }

  // stops auto mode and returns the popup to its idle state (grid + start controls).
  // does not close the popup.
  function stopAuto() {
    autoModeEnabled = false;
    autoPointer = -1;
    currentHex = null;
    previousHex = null;
    lastLineKey = null;
    awaitingReturn = false;
    autoSequence.forEach(c => c.classList.remove('current', 'next-preview'));
    detachWatcher(watchedWindow);
    removeAutoOverlay();
    stopLiveTimer();
    if (pipWindow) ensurePipIdleBar();
  }

  function saveSession() {
    if (!loadedImageDataURL || allCells.length === 0) return;
    const usedFlags = allCells.map(c => c.classList.contains('used'));
    const cellSize = currentGridWrap ? parseInt(currentGridWrap.dataset.cellSize, 10) : parseInt(cellSizeInput.value, 10);
    const data = {
      imageDataURL: loadedImageDataURL,
      gridW: gridDims.w, gridH: gridDims.h, cellSize,
      usedFlags, savedAt: Date.now()
    };
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      showToastIn(pipWindow || window, 'Progress saved');
    } catch (err) {
      showToastIn(pipWindow || window, 'Could not save progress');
    }
  }

  function startLiveTimer() {
    stopLiveTimer();
    liveTimerId = setInterval(() => {
      if (overlayEls && overlayEls.agoEl && lastCopiedAt) {
        overlayEls.agoEl.textContent = formatAgo(Date.now() - lastCopiedAt);
      }
    }, 500);
  }
  function stopLiveTimer() {
    if (liveTimerId) { clearInterval(liveTimerId); liveTimerId = null; }
  }

  // ---------- focus-return + keyboard shortcuts (popup only) ----------

  // clicking back into the popup both focuses the window AND fires a click —
  // without this, that single click used to advance twice. The focus-triggered
  // advance is delayed briefly; any click that follows (captured at the window,
  // so it still counts even if the click target stops the event bubbling)
  // cancels it, leaving only the click's own action.
  let pendingFocusAdvance = null;
  function cancelPendingFocusAdvance() {
    if (pendingFocusAdvance) { clearTimeout(pendingFocusAdvance); pendingFocusAdvance = null; }
  }

  function onBlurHandler() { if (autoModeEnabled) awaitingReturn = true; }
  function onFocusHandler() {
    if (autoModeEnabled && awaitingReturn) {
      awaitingReturn = false;
      cancelPendingFocusAdvance();
      pendingFocusAdvance = setTimeout(() => { pendingFocusAdvance = null; goNext(); }, 220);
    }
  }
  function onKeyHandler(e) {
    if (!autoModeEnabled) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    else if (e.key === 'Escape') { e.preventDefault(); stopAuto(); }
  }
  function attachWatcher(win) {
    detachWatcher(watchedWindow);
    watchedWindow = win;
    win.addEventListener('blur', onBlurHandler);
    win.addEventListener('focus', onFocusHandler);
    win.addEventListener('keydown', onKeyHandler);
    win.addEventListener('click', cancelPendingFocusAdvance, true);
  }
  function detachWatcher(win) {
    if (!win) return;
    win.removeEventListener('blur', onBlurHandler);
    win.removeEventListener('focus', onFocusHandler);
    win.removeEventListener('keydown', onKeyHandler);
    win.removeEventListener('click', cancelPendingFocusAdvance, true);
    if (win === watchedWindow) watchedWindow = null;
    cancelPendingFocusAdvance();
  }

  // ---------- auto mode overlay (transparent, click-anywhere, in the popup) ----------

  function buildAutoOverlay() {
    if (!pipWindow) return;
    removeAutoOverlay();
    const doc = pipWindow.document;
    const area = doc.querySelector('.pip-click-area');
    if (!area) return;

    const overlay = doc.createElement('div');
    overlay.className = 'auto-overlay';

    const scrim = doc.createElement('div');
    scrim.className = 'scrim';

    const header = doc.createElement('div');
    header.className = 'auto-overlay-header';

    const icon = doc.createElement('div');
    icon.className = 'auto-icon';

    const headerText = doc.createElement('div');
    headerText.className = 'auto-header-text';
    const progressEl = doc.createElement('div');
    progressEl.className = 'auto-progress-text';
    const agoEl = doc.createElement('div');
    agoEl.className = 'auto-ago-text';
    headerText.appendChild(progressEl);
    headerText.appendChild(agoEl);

    const spacer = doc.createElement('div');
    spacer.className = 'auto-header-spacer';

    const soundBtn = doc.createElement('button');
    soundBtn.className = 'auto-mini-btn';
    soundBtn.type = 'button';

    const hoverBtn = doc.createElement('button');
    hoverBtn.className = 'auto-mini-btn square';
    hoverBtn.type = 'button';
    hoverBtn.textContent = '▢';
    hoverBtn.title = 'Hover mode — advance by hovering the box below, no click or window focus needed';

    const backBtn = doc.createElement('button');
    backBtn.className = 'auto-mini-btn';
    backBtn.type = 'button';
    backBtn.textContent = '↩';
    backBtn.title = 'Undo';

    const restartBtn = doc.createElement('button');
    restartBtn.className = 'auto-mini-btn';
    restartBtn.type = 'button';
    restartBtn.textContent = '⟲';
    restartBtn.title = 'Restart this run from the beginning';

    const closeBtn = doc.createElement('button');
    closeBtn.className = 'auto-mini-btn close';
    closeBtn.type = 'button';
    closeBtn.textContent = '✕';
    closeBtn.title = 'Exit auto mode';

    header.appendChild(icon);
    header.appendChild(headerText);
    header.appendChild(spacer);
    header.appendChild(soundBtn);
    header.appendChild(hoverBtn);
    header.appendChild(backBtn);
    header.appendChild(restartBtn);
    header.appendChild(closeBtn);

    const clickArea = doc.createElement('div');
    clickArea.className = 'auto-click-area';

    const flash = doc.createElement('div');
    flash.className = 'auto-flash';

    const hoverZone = doc.createElement('div');
    hoverZone.className = 'hover-zone';
    const hzIcon = doc.createElement('div');
    hzIcon.className = 'hz-icon';
    hzIcon.textContent = '▢';
    const hzLabel = doc.createElement('div');
    hzLabel.textContent = 'Hover to advance';
    hoverZone.appendChild(hzIcon);
    hoverZone.appendChild(hzLabel);

    clickArea.appendChild(hoverZone);
    clickArea.appendChild(flash);

    const footer = doc.createElement('div');
    footer.className = 'auto-footer';
    const saveBtn = doc.createElement('button');
    saveBtn.type = 'button';
    saveBtn.textContent = 'Save & exit';
    footer.appendChild(saveBtn);

    overlay.appendChild(scrim);
    overlay.appendChild(header);
    overlay.appendChild(clickArea);
    overlay.appendChild(footer);
    area.appendChild(overlay);

    [header, footer].forEach(el => el.addEventListener('click', e => e.stopPropagation()));
    clickArea.addEventListener('click', () => goNext());
    // the hover zone advances on hover alone; swallow its own clicks so hovering
    // in and then clicking doesn't count as two separate advances
    hoverZone.addEventListener('click', e => e.stopPropagation());
    hoverZone.addEventListener('mouseenter', () => {
      cancelPendingFocusAdvance();
      goNext();
    });
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      updateOverlay();
    });
    hoverBtn.addEventListener('click', () => {
      hoverModeEnabled = !hoverModeEnabled;
      updateOverlay();
    });
    backBtn.addEventListener('click', goBack);
    restartBtn.addEventListener('click', restartAuto);
    closeBtn.addEventListener('click', () => stopAuto());
    saveBtn.addEventListener('click', () => { saveSession(); stopAuto(); });

    overlayEls = { overlay, icon, progressEl, agoEl, soundBtn, hoverBtn, hoverZone, backBtn, flash };
    updateOverlay();
  }

  function removeAutoOverlay() {
    if (overlayEls && overlayEls.overlay) overlayEls.overlay.remove();
    overlayEls = null;
  }

  function updateOverlay() {
    if (!overlayEls) return;
    overlayEls.progressEl.textContent = autoSequence.length ? `${autoPointer + 1} / ${autoSequence.length}` : '';
    overlayEls.agoEl.textContent = lastCopiedAt ? formatAgo(Date.now() - lastCopiedAt) : '';
    overlayEls.icon.style.background = currentHex || '#888888';
    overlayEls.soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    overlayEls.backBtn.disabled = autoPointer <= 0;
  }

  function flashBand(name, color) {
    if (!overlayEls || !overlayEls.flash) return;
    const el = overlayEls.flash;
    el.textContent = name;
    el.style.color = color;
    el.classList.remove('show');
    // force reflow so the animation restarts on repeated same-color flashes
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 450);
  }

  // ---------- popup idle controls (grid visible, auto mode not running) ----------

  // Two-step flow: click any block below to mark where auto mode should pick
  // up (handled by selectStartCell, wired on the cells themselves), then pick
  // a direction here to begin. Skipping the block click just starts from the
  // matching edge.
  function ensurePipIdleBar() {
    if (!pipWindow) return;
    removePipIdleBar();
    const doc = pipWindow.document;
    const bar = doc.createElement('div');
    bar.className = 'pip-idle-bar';

    const topRow = doc.createElement('div');
    topRow.className = 'pip-idle-row';

    const info = doc.createElement('span');
    info.className = 'pip-idle-info';
    info.textContent = `${gridDims.w} × ${gridDims.h} — ${allCells.length} squares`;

    const startIndicator = doc.createElement('div');
    startIndicator.className = 'start-indicator' + (startCell ? ' picked' : '');
    const startText = doc.createElement('span');
    startText.className = 'start-indicator-text';
    startText.textContent = startCell
      ? `Start block: col ${+startCell.dataset.gx + 1}, row ${+startCell.dataset.gy + 1}`
      : 'Click a block to set the start point (optional)';
    startIndicator.appendChild(startText);
    if (startCell) {
      const clearBtn = doc.createElement('button');
      clearBtn.className = 'start-clear-btn';
      clearBtn.type = 'button';
      clearBtn.textContent = '✕';
      clearBtn.title = 'Clear start block';
      clearBtn.addEventListener('click', () => {
        startCell.classList.remove('start-marker');
        startCell = null;
        ensurePipIdleBar();
      });
      startIndicator.appendChild(clearBtn);
    }

    topRow.appendChild(info);
    topRow.appendChild(startIndicator);

    const dirRow = doc.createElement('div');
    dirRow.className = 'pip-idle-row';

    const dirPicker = doc.createElement('div');
    dirPicker.className = 'dir-picker';
    const dirLabel = doc.createElement('span');
    dirLabel.className = 'dir-picker-label';
    dirLabel.textContent = 'Then choose a direction';
    dirPicker.appendChild(dirLabel);

    const dirs = [
      { key: 'down', glyph: '↓', label: 'Down' },
      { key: 'up', glyph: '↑', label: 'Up' },
      { key: 'right', glyph: '→', label: 'Right' },
      { key: 'left', glyph: '←', label: 'Left' }
    ];
    dirs.forEach(d => {
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'dir-btn';
      const glyph = doc.createElement('span');
      glyph.className = 'glyph';
      glyph.textContent = d.glyph;
      b.appendChild(glyph);
      b.appendChild(doc.createTextNode(d.label));
      b.addEventListener('click', () => {
        direction = d.key;
        startAuto();
      });
      dirPicker.appendChild(b);
    });

    dirRow.appendChild(dirPicker);

    bar.appendChild(topRow);
    bar.appendChild(dirRow);
    doc.body.insertBefore(bar, doc.body.firstChild);
    pipIdleBarEl = bar;
  }

  // marks a clicked block as the start point for the next auto-mode run
  function selectStartCell(cell) {
    if (startCell) startCell.classList.remove('start-marker');
    startCell = cell;
    startCell.classList.add('start-marker');
    ensurePipIdleBar();
  }

  function removePipIdleBar() {
    if (pipIdleBarEl) { pipIdleBarEl.remove(); pipIdleBarEl = null; }
  }

  // ---------- grid mounting + PiP ----------

  function applyCellSize(gridWrap, gridW, gridH, cellSize) {
    const grid = gridWrap.querySelector('.grid');
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;
    gridWrap.querySelectorAll('.grid .cell').forEach(c => {
      c.style.width = cellSize + 'px';
      c.style.height = cellSize + 'px';
    });

    gridWrap.querySelectorAll('.calibration-row').forEach(calRow => {
      calRow.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
      calRow.querySelectorAll('.calibration-cell').forEach(c => {
        c.style.width = cellSize + 'px';
        c.style.height = cellSize + 'px';
      });
    });
  }

  // fits the whole grid (plus the two reference rows) inside the popup's
  // click area with no cropping or scrolling — recalculated on every resize
  function layoutPipView() {
    if (!pipWindow || !currentGridWrap) return;
    const area = pipWindow.document.querySelector('.pip-click-area');
    if (!area) return;
    const gridW = gridDims.w, gridH = gridDims.h;
    const totalRows = gridH + 2; // + top and bottom reference rows

    const availW = Math.max(20, area.clientWidth - 16);
    const availH = Math.max(20, area.clientHeight - 16);

    const sizeByW = Math.floor((availW - PAD * 2 - BORDER * 2) / gridW);
    const sizeByH = Math.floor((availH - PAD * 2 - BORDER * 2) / totalRows);
    const size = Math.max(2, Math.min(sizeByW, sizeByH));

    applyCellSize(currentGridWrap, gridW, gridH, size);
  }

  function restoreManualCellSize() {
    if (!currentGridWrap) return;
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    applyCellSize(currentGridWrap, gridDims.w, gridDims.h, cellSize);
  }

  function mountGrid(gridWrap, gridW, gridH, cellSize) {
    currentGridWrap = gridWrap;
    gridWrap.dataset.gridW = gridW;
    gridWrap.dataset.gridH = gridH;
    gridWrap.dataset.cellSize = cellSize;

    if (pipWindow) {
      let area = pipWindow.document.querySelector('.pip-click-area');
      if (!area) {
        area = pipWindow.document.createElement('div');
        area.className = 'pip-click-area';
        pipWindow.document.body.appendChild(area);
      }
      area.querySelectorAll('.grid-wrap').forEach(el => el.remove());
      area.appendChild(gridWrap);
      layoutPipView();
    } else {
      stage.innerHTML = '';
      stage.appendChild(gridWrap);
    }

    pipBtn.disabled = !('documentPictureInPicture' in window);
  }

  function onPipResize() { layoutPipView(); }

  async function openPip() {
    if (pipWindow) return pipWindow;
    if (!('documentPictureInPicture' in window)) return null;
    if (!currentGridWrap) return null;

    pipWindow = await documentPictureInPicture.requestWindow({ width: PIP_DEFAULT_W, height: PIP_DEFAULT_H });

    for (const styleEl of document.querySelectorAll('style')) {
      pipWindow.document.head.appendChild(styleEl.cloneNode(true));
    }
    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.style.background = '#ffffff';
    pipWindow.document.body.style.overflow = 'hidden';
    pipWindow.document.body.style.display = 'flex';
    pipWindow.document.body.style.flexDirection = 'column';
    pipWindow.document.body.style.height = '100vh';

    const gridW = parseInt(currentGridWrap.dataset.gridW, 10);
    const gridH = parseInt(currentGridWrap.dataset.gridH, 10);
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    mountGrid(currentGridWrap, gridW, gridH, cellSize);
    ensurePipIdleBar();

    pipWindow.addEventListener('resize', onPipResize);

    // closing the popup (by any means) always stops auto mode — auto mode
    // only exists inside the popup, so there is nothing left to migrate.
    pipWindow.addEventListener('pagehide', () => {
      if (autoModeEnabled) stopAuto();
      pipWindow = null;
      pipIdleBarEl = null;
      overlayEls = null;
      stage.innerHTML = '';
      stage.appendChild(currentGridWrap);
      restoreManualCellSize();
    }, { once: true });

    return pipWindow;
  }

  // ---------- manual (non-auto) cell click, only relevant on the main page ----------

  function handleManualCellClick(cell) {
    const hex = cell.dataset.hex;
    const win = cell.ownerDocument.defaultView;
    copyToClipboard(hex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + hex) : 'Copy failed');
    });
    cell.classList.toggle('used');
  }

  // ---------- image + grid building ----------

  function buildCalibrationRow(gridW, cellSize) {
    const row = document.createElement('div');
    row.className = 'calibration-row';
    row.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;

    const centerXs = gridW % 2 === 1 ? [(gridW - 1) / 2] : [gridW / 2 - 1, gridW / 2];

    for (let x = 0; x < gridW; x++) {
      const hex = bandColorFor(x, gridW);
      const sq = document.createElement('div');
      sq.className = 'cell calibration-cell';
      sq.style.width = cellSize + 'px';
      sq.style.height = cellSize + 'px';
      sq.style.background = hex;
      sq.style.cursor = 'default';
      sq.title = 'Alignment reference — not copyable';
      if (centerXs.includes(x)) sq.classList.add('center-mark-cell');
      // intentionally no click handler: this row is only for checking that
      // your build lines up, and should never be copied to the clipboard.
      row.appendChild(sq);
    }
    return row;
  }

  function buildGridFromImage(img, gridW, gridH, cellSize) {
    workCanvas.width = gridW;
    workCanvas.height = gridH;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, gridW, gridH);

    let pixelData;
    try {
      pixelData = ctx.getImageData(0, 0, gridW, gridH).data;
    } catch (err) { return null; }

    allCells = [];
    startCell = null; // a fresh grid means any previously picked start block no longer applies
    gridDims = { w: gridW, h: gridH };

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;

    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const idx = (y * gridW + x) * 4;
        const r = pixelData[idx], g = pixelData[idx + 1], b = pixelData[idx + 2];
        const hex = rgbToHex(r, g, b);

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.background = hex;
        cell.title = hex;
        cell.dataset.hex = hex;
        cell.dataset.gx = x;
        cell.dataset.gy = y;
        // checkmark color matches the reference rows' expected color for this column
        cell.style.setProperty('--check-color', bandColorFor(x, gridW));

        cell.addEventListener('click', () => {
          if (autoModeEnabled) return; // in auto mode, only the overlay click area advances
          if (pipWindow && cell.ownerDocument === pipWindow.document) {
            selectStartCell(cell); // in the popup, a click before auto starts picks the start block
          } else {
            handleManualCellClick(cell);
          }
        });
        allCells.push(cell);

        grid.appendChild(cell);
      }
    }

    // reference rows above AND below the grid, so you can check alignment
    // at either end of a tall build — both use the same column coloring,
    // which is also what the checkmarks match.
    gridWrap.appendChild(buildCalibrationRow(gridW, cellSize));
    gridWrap.appendChild(grid);
    gridWrap.appendChild(buildCalibrationRow(gridW, cellSize));

    return gridWrap;
  }

  // ---------- resume from localStorage ----------

  function offerResume() {
    let raw;
    try { raw = localStorage.getItem(SESSION_KEY); } catch (err) { return; }
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (err) { return; }
    if (!data || !data.imageDataURL || !data.gridW || !data.gridH) return;

    const usedCount = Array.isArray(data.usedFlags) ? data.usedFlags.filter(Boolean).length : 0;
    const total = data.gridW * data.gridH;

    const banner = document.createElement('div');
    banner.className = 'resume-banner';
    const text = document.createElement('span');
    text.textContent = `Saved session found — ${data.gridW} × ${data.gridH}, ${usedCount} of ${total} placed.`;
    const resumeBtn = document.createElement('button');
    resumeBtn.textContent = 'Resume';
    const dismissBtn = document.createElement('button');
    dismissBtn.className = 'resume-dismiss';
    dismissBtn.textContent = 'Dismiss';

    resumeBtn.addEventListener('click', () => { resumeSession(data); banner.remove(); });
    dismissBtn.addEventListener('click', () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
      banner.remove();
    });

    banner.appendChild(text);
    banner.appendChild(resumeBtn);
    banner.appendChild(dismissBtn);
    resumeBannerSlot.appendChild(banner);
  }

  function resumeSession(data) {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      loadedImageDataURL = data.imageDataURL;
      generateBtn.disabled = false;
      widthInput.value = data.gridW;
      heightInput.value = data.gridH;
      cellSizeInput.value = data.cellSize;

      const gridWrap = buildGridFromImage(img, data.gridW, data.gridH, data.cellSize);
      if (!gridWrap) return;

      if (Array.isArray(data.usedFlags)) {
        data.usedFlags.forEach((used, i) => {
          if (used && allCells[i]) allCells[i].classList.add('used');
        });
      }

      mountGrid(gridWrap, data.gridW, data.gridH, data.cellSize);
      infoText.textContent = `${data.gridW} × ${data.gridH} = ${data.gridW * data.gridH} blocks`;
    };
    img.src = data.imageDataURL;
  }

  // ---------- events ----------

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) { loadedImage = null; loadedImageDataURL = null; generateBtn.disabled = true; return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        loadedImageDataURL = e.target.result;
        generateBtn.disabled = false;
        const w = parseInt(widthInput.value, 10) || 32;
        const ratio = img.height / img.width;
        heightInput.value = Math.max(1, Math.round(w * ratio));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  widthInput.addEventListener('change', () => {
    if (!loadedImage) return;
    const w = parseInt(widthInput.value, 10) || 32;
    const ratio = loadedImage.height / loadedImage.width;
    heightInput.value = Math.max(1, Math.round(w * ratio));
  });

  [widthInput, heightInput, cellSizeInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !generateBtn.disabled) generateBtn.click();
    });
  });

  generateBtn.addEventListener('click', () => {
    if (!loadedImage) return;
    const gridW = Math.max(1, Math.min(256, parseInt(widthInput.value, 10) || 32));
    const gridH = Math.max(1, Math.min(256, parseInt(heightInput.value, 10) || 32));
    const cellSize = Math.max(4, Math.min(64, parseInt(cellSizeInput.value, 10) || 22));

    if (pipWindow) pipWindow.close();
    const gridWrap = buildGridFromImage(loadedImage, gridW, gridH, cellSize);
    if (!gridWrap) {
      stage.innerHTML = '<div class="placeholder">Could not read image data (possibly a cross-origin image).</div>';
      return;
    }
    mountGrid(gridWrap, gridW, gridH, cellSize);
    infoText.textContent = `${gridW} × ${gridH} = ${gridW * gridH} blocks`;
  });

  pipBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if (!('documentPictureInPicture' in window)) {
      showToastIn(window, 'PiP not supported in this browser');
      return;
    }
    await openPip();
  });

  offerResume();
</script>

</body>
</html>
