<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Grid Color Picker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #111111;
  }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px;
    padding: 10px 16px;
  }

  .toolbar-row + .toolbar-row { border-top: 1px solid #eeeeee; }
  .topbar { border-bottom: 1px solid #dddddd; }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666666;
  }

  input[type="file"], input[type="number"], select {
    border: 1px solid #cccccc;
    padding: 6px 8px;
    font-size: 13px;
    background: #ffffff;
    color: #111111;
    outline: none;
  }
  input[type="number"] { width: 80px; }

  input[type="file"]::file-selector-button {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    padding: 5px 8px;
    margin-right: 8px;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover { background: #111111; color: #ffffff; }

  button {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    height: fit-content;
  }
  button:hover { background: #333333; }
  button:disabled { background: #cccccc; border-color: #cccccc; cursor: not-allowed; }

  #pipBtn { background: #ffffff; color: #111111; }
  #pipBtn:hover:not(:disabled) { background: #111111; color: #ffffff; }
  #pipBtn:disabled { background: #ffffff; color: #cccccc; border-color: #cccccc; }

  .accent-btn { background: #b91c1c; border-color: #b91c1c; }
  .accent-btn:hover:not(:disabled) { background: #7f1414; border-color: #7f1414; }
  .accent-btn:disabled { background: #cccccc; border-color: #cccccc; }

  .info { font-size: 12px; color: #666666; margin-left: auto; }

  .stage { padding: 18px; }

  .grid-wrap {
    display: inline-block;
    position: relative;
    border: 1px solid #dddddd;
    padding: 6px;
    background: #ffffff;
  }

  .grid { display: grid; line-height: 0; }

  .cell { position: relative; width: 22px; height: 22px; cursor: pointer; }

  .cell:hover::after {
    content: "";
    position: absolute;
    inset: 0;
    outline: 2px solid #111111;
    outline-offset: -2px;
  }

  .cell.used { filter: grayscale(1) brightness(1.15); }
  .cell.used::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.35);
  }
  .cell.used::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: var(--check-color, #111111);
    text-shadow: 0 0 2px #fff, 0 0 2px #fff;
  }

  .cell.current { outline: 3px solid #111111; outline-offset: -3px; z-index: 3; }

  .cell.next-preview {
    outline: 2px solid #ffffff;
    outline-offset: -4px;
    box-shadow: inset 0 0 0 2px #000000;
    z-index: 3;
  }

  /* row/column focus highlighting used inside the popup */
  .cell.line-adjacent { filter: brightness(0.5); }
  .cell.used.line-adjacent { filter: grayscale(1) brightness(0.55); }
  .cell.line-far { filter: brightness(0.1); }
  .cell.used.line-far { filter: grayscale(1) brightness(0.08); }

  .center-guide {
    position: absolute;
    background: #d32020;
    pointer-events: none;
    z-index: 6;
  }
  .center-guide.vertical { width: 2px; height: 7px; margin-left: -1px; }
  .center-guide.horizontal { height: 2px; width: 7px; margin-top: -1px; }

  .calibration-strip {
    position: absolute;
    top: 0;
    right: 6px;
    transform: translateY(-100%);
    display: flex;
    gap: 2px;
    border: 1px solid #111111;
    z-index: 5;
  }
  .calibration-square { cursor: pointer; }

  .placeholder { padding: 60px 20px; text-align: center; color: #999999; font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111111;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .resume-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 2px solid #b91c1c;
    background: #ffffff;
    font-size: 13px;
  }
  .resume-banner button { padding: 5px 10px; font-size: 12px; }
  .resume-dismiss { background: #ffffff; color: #111111; border: 1px solid #cccccc; }
  .resume-dismiss:hover { background: #f2f2f2; }

  /* --- compact auto-mode banner --- */

  .auto-panel {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    font-size: 12px;
    padding: 6px 10px;
    border-bottom: 2px solid #111111;
    flex-shrink: 0;
  }
  .auto-panel.floating {
    position: fixed;
    top: 12px;
    right: 12px;
    max-width: 380px;
    border: 2px solid #111111;
    z-index: 1000;
  }

  .auto-exit-btn {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    width: 20px;
    height: 20px;
    padding: 0;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .auto-exit-btn:hover { background: #111111; color: #ffffff; }

  .auto-progress { font-size: 11px; color: #444444; white-space: nowrap; }

  .auto-mini {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .auto-mini-label { font-size: 9px; text-transform: uppercase; color: #999999; }
  .auto-mini-swatch { width: 16px; height: 16px; border: 1px solid #999999; flex-shrink: 0; }
  .auto-mini-swatch.big { width: 20px; height: 20px; border: 2px solid #111111; }
  .auto-hex { font-family: monospace; font-size: 11px; }

  .auto-nav-btn {
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .auto-nav-btn:hover:not(:disabled) { background: #111111; color: #ffffff; }
  .auto-nav-btn:disabled { color: #cccccc; border-color: #cccccc; cursor: not-allowed; }

  .auto-panel select {
    padding: 4px 5px;
    font-size: 11px;
  }

  .auto-sound-toggle {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    white-space: nowrap;
  }

  .auto-save-btn {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 5px 10px;
    font-size: 11px;
    cursor: pointer;
    margin-left: auto;
  }
  .auto-save-btn:hover { background: #333333; }

  .pip-grid-area {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="resumeBannerSlot"></div>

<div class="topbar">
  <div class="toolbar-row">
    <div class="field">
      <label for="imageInput">Image</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="field">
      <label for="widthInput">Width (blocks)</label>
      <input type="number" id="widthInput" value="32" min="1" max="256">
    </div>
    <div class="field">
      <label for="heightInput">Height (blocks)</label>
      <input type="number" id="heightInput" value="32" min="1" max="256">
    </div>
    <div class="field">
      <label for="cellSizeInput">Preview size (px)</label>
      <input type="number" id="cellSizeInput" value="22" min="4" max="64">
    </div>
    <button id="generateBtn" disabled>Generate</button>
    <button id="pipBtn" disabled>Pop out</button>
    <div class="info" id="infoText"></div>
  </div>

  <div class="toolbar-row">
    <div class="field">
      <label for="cornerSelect">Start corner</label>
      <select id="cornerSelect">
        <option value="tl">Top-left</option>
        <option value="tr">Top-right</option>
        <option value="bl">Bottom-left</option>
        <option value="br">Bottom-right</option>
      </select>
    </div>
    <div class="field">
      <label for="directionSelect">Direction</label>
      <select id="directionSelect">
        <option value="horizontal">Row by row</option>
        <option value="vertical">Column by column</option>
      </select>
    </div>
    <button id="startAutoBtn" class="accent-btn" disabled>Start Auto Mode</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="placeholder">Upload an image, set your grid size, and click Generate.</div>
</div>

<div class="toast" id="toast"></div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const cellSizeInput = document.getElementById('cellSizeInput');
  const generateBtn = document.getElementById('generateBtn');
  const pipBtn = document.getElementById('pipBtn');
  const cornerSelect = document.getElementById('cornerSelect');
  const directionSelect = document.getElementById('directionSelect');
  const startAutoBtn = document.getElementById('startAutoBtn');
  const stage = document.getElementById('stage');
  const infoText = document.getElementById('infoText');
  const resumeBannerSlot = document.getElementById('resumeBannerSlot');
  const workCanvas = document.getElementById('workCanvas');
  const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

  const PAD = 6;
  const BORDER = 1;
  const SESSION_KEY = 'pixelGridSession';
  const PIP_DEFAULT_W = 480;
  const PIP_DEFAULT_H = 380;

  let loadedImage = null;
  let loadedImageDataURL = null;
  let currentGridWrap = null;
  let pipWindow = null;
  let gridDims = { w: 0, h: 0 };

  let orderedCells = [];
  let sequence = [];

  let autoModeEnabled = false;
  let startCorner = 'tl';
  let sweepDirection = 'horizontal';
  let autoPointer = -1;
  let currentHex = null;
  let previousHex = null;
  let lastLineCoord = null;
  let soundEnabled = true;
  let awaitingReturn = false;
  let watchedWindow = null;
  let autoPanelInstances = [];
  let focusCellSize = 22;

  if (!('documentPictureInPicture' in window)) {
    pipBtn.title = 'Picture-in-picture is not supported in this browser (try Chrome or Edge).';
  }

  function getActiveWindow() { return pipWindow || window; }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function dominantColor(hex) {
    const r = parseInt(hex.substr(1, 2), 16);
    const g = parseInt(hex.substr(3, 2), 16);
    const b = parseInt(hex.substr(5, 2), 16);
    if (r >= g && r >= b) return '#ff0000';
    if (g >= r && g >= b) return '#00ff00';
    return '#0000ff';
  }

  // ---------- clipboard ----------

  async function tryClipboardWrite(win, text) {
    try {
      if (!win.navigator.clipboard || !win.navigator.clipboard.writeText) return false;
      await win.navigator.clipboard.writeText(text);
      return true;
    } catch (err) { return false; }
  }

  function execCommandCopy(win, text) {
    try {
      const ta = win.document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      win.document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = win.document.execCommand('copy');
      win.document.body.removeChild(ta);
      return ok;
    } catch (err) { return false; }
  }

  async function copyToClipboard(text, cellWin) {
    if (await tryClipboardWrite(window, text)) return true;
    if (cellWin !== window && await tryClipboardWrite(cellWin, text)) return true;
    if (execCommandCopy(window, text)) return true;
    if (cellWin !== window && execCommandCopy(cellWin, text)) return true;
    return false;
  }

  function showToastIn(win, msg) {
    let t = win.document.querySelector('.toast');
    if (!t) {
      t = win.document.createElement('div');
      t.className = 'toast';
      win.document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1200);
  }

  function speak(text) {
    if (!soundEnabled) return;
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.4;
        u.volume = 0.6;
        window.speechSynthesis.speak(u);
      }
    } catch (err) { /* ignore */ }
  }

  // ---------- auto mode engine ----------

  function buildSequenceFromOrder(corner, direction) {
    const gw = gridDims.w, gh = gridDims.h;
    const xs = []; for (let x = 0; x < gw; x++) xs.push(x);
    const ys = []; for (let y = 0; y < gh; y++) ys.push(y);
    const startLeft = corner === 'tl' || corner === 'bl';
    const startTop = corner === 'tl' || corner === 'tr';
    const orderedXs = startLeft ? xs : xs.slice().reverse();
    const orderedYs = startTop ? ys : ys.slice().reverse();
    const seq = [];
    if (direction === 'vertical') {
      for (const x of orderedXs) for (const y of orderedYs) seq.push(orderedCells[y * gw + x]);
    } else {
      for (const y of orderedYs) for (const x of orderedXs) seq.push(orderedCells[y * gw + x]);
    }
    return seq;
  }

  function applyOrder(corner, direction, keepProgress) {
    startCorner = corner;
    sweepDirection = direction;
    sequence = buildSequenceFromOrder(corner, direction);
    if (keepProgress) {
      const idx = sequence.findIndex(c => !c.classList.contains('used'));
      autoPointer = idx === -1 ? sequence.length - 1 : idx;
    } else {
      autoPointer = 0;
    }
  }

  function lineCoordOf(cell) {
    return sweepDirection === 'vertical' ? parseInt(cell.dataset.gx, 10) : parseInt(cell.dataset.gy, 10);
  }

  function remainingInLine(pointerIdx) {
    const coord = lineCoordOf(sequence[pointerIdx]);
    let remaining = 0;
    for (let i = pointerIdx + 1; i < sequence.length; i++) {
      if (lineCoordOf(sequence[i]) !== coord) break;
      remaining++;
    }
    return remaining;
  }

  function activateCell(cell) {
    orderedCells.forEach(c => c.classList.remove('current', 'next-preview'));
    if (currentHex !== null) previousHex = currentHex;
    cell.classList.add('used');
    cell.classList.add('current');
    currentHex = cell.dataset.hex;

    if (autoPointer + 1 < sequence.length) sequence[autoPointer + 1].classList.add('next-preview');

    const win = cell.ownerDocument.defaultView;
    copyToClipboard(currentHex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + currentHex) : 'Copy failed');
    });

    const coord = lineCoordOf(cell);
    const noun = sweepDirection === 'vertical' ? 'column' : 'row';
    if (lastLineCoord !== null && coord !== lastLineCoord) {
      speak('New ' + noun);
    } else {
      const remaining = remainingInLine(autoPointer);
      if (remaining > 0 && remaining <= 2) {
        speak(remaining + ' left in ' + noun);
      } else {
        speak('Copied');
      }
    }
    lastLineCoord = coord;

    updateLineFocus();
    updateAutoPanels();
  }

  function goNext() {
    if (!autoModeEnabled) return;
    if (autoPointer >= sequence.length - 1) {
      showToastIn(getActiveWindow(), 'All done!');
      return;
    }
    autoPointer += 1;
    activateCell(sequence[autoPointer]);
  }

  function goBack() {
    if (!autoModeEnabled) return;
    if (autoPointer <= 0) return;
    autoPointer -= 1;
    activateCell(sequence[autoPointer]);
  }

  function startAuto(corner, direction) {
    if (orderedCells.length === 0) return;
    const keepProgress = orderedCells.some(c => c.classList.contains('used'));
    applyOrder(corner, direction, keepProgress);
    autoModeEnabled = true;
    currentHex = null;
    previousHex = null;
    lastLineCoord = null;
    activateCell(sequence[autoPointer]);
    ensureAutoPanel();
    attachWatcher(getActiveWindow());
  }

  function stopAuto() {
    autoModeEnabled = false;
    autoPointer = -1;
    currentHex = null;
    previousHex = null;
    lastLineCoord = null;
    awaitingReturn = false;
    orderedCells.forEach(c => c.classList.remove('current', 'next-preview'));
    detachWatcher(watchedWindow);
    removeAutoPanels();
    clearLineFocus();
  }

  function saveSession() {
    if (!loadedImageDataURL || orderedCells.length === 0) return;
    const usedFlags = orderedCells.map(c => c.classList.contains('used'));
    const cellSize = currentGridWrap ? parseInt(currentGridWrap.dataset.cellSize, 10) : parseInt(cellSizeInput.value, 10);
    const data = {
      imageDataURL: loadedImageDataURL,
      gridW: gridDims.w, gridH: gridDims.h, cellSize,
      corner: startCorner, direction: sweepDirection,
      usedFlags, savedAt: Date.now()
    };
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      showToastIn(getActiveWindow(), 'Progress saved');
    } catch (err) {
      showToastIn(getActiveWindow(), 'Could not save progress');
    }
  }

  // ---------- row/column focus highlighting (popup only) ----------

  function updateLineFocus() {
    if (!pipWindow) return;
    const lineIdx = sequence[autoPointer] ? lineCoordOf(sequence[autoPointer]) : 0;
    orderedCells.forEach(c => {
      const coord = lineCoordOf(c);
      const diff = coord - lineIdx;
      c.classList.remove('line-adjacent', 'line-far');
      if (diff !== 0) {
        c.classList.add(Math.abs(diff) === 1 ? 'line-adjacent' : 'line-far');
      }
    });
    scrollToLine(lineIdx);
  }

  function clearLineFocus() {
    orderedCells.forEach(c => c.classList.remove('line-adjacent', 'line-far'));
  }

  function scrollToLine(lineIdx) {
    if (!pipWindow) return;
    const area = pipWindow.document.querySelector('.pip-grid-area');
    if (!area) return;
    const target = Math.max(0, (lineIdx - 1) * focusCellSize);
    if (sweepDirection === 'vertical') {
      area.scrollTo({ left: target, behavior: 'smooth' });
    } else {
      area.scrollTo({ top: target, behavior: 'smooth' });
    }
  }

  // ---------- focus-return + keyboard shortcuts ----------

  function onBlurHandler() { if (autoModeEnabled) awaitingReturn = true; }
  function onFocusHandler() {
    if (autoModeEnabled && awaitingReturn) { awaitingReturn = false; goNext(); }
  }
  function onKeyHandler(e) {
    if (!autoModeEnabled) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      const wasPip = pipWindow && watchedWindow === pipWindow;
      stopAuto();
      if (wasPip) pipWindow.close();
    }
  }
  function attachWatcher(win) {
    detachWatcher(watchedWindow);
    watchedWindow = win;
    win.addEventListener('blur', onBlurHandler);
    win.addEventListener('focus', onFocusHandler);
    win.addEventListener('keydown', onKeyHandler);
  }
  function detachWatcher(win) {
    if (!win) return;
    win.removeEventListener('blur', onBlurHandler);
    win.removeEventListener('focus', onFocusHandler);
    win.removeEventListener('keydown', onKeyHandler);
    if (win === watchedWindow) watchedWindow = null;
  }

  // ---------- compact auto-mode banner ----------

  function createAutoPanel(doc, isPip) {
    const root = doc.createElement('div');
    root.className = 'auto-panel' + (isPip ? '' : ' floating');
    root.addEventListener('click', e => e.stopPropagation());

    const exitBtn = doc.createElement('button');
    exitBtn.className = 'auto-exit-btn';
    exitBtn.textContent = '✕';
    exitBtn.title = 'Exit auto mode';

    const progressEl = doc.createElement('div');
    progressEl.className = 'auto-progress';

    const curWrap = doc.createElement('div');
    curWrap.className = 'auto-mini';
    const currentSwatch = doc.createElement('div');
    currentSwatch.className = 'auto-mini-swatch big';
    const currentHexEl = doc.createElement('span');
    currentHexEl.className = 'auto-hex';
    curWrap.appendChild(currentSwatch);
    curWrap.appendChild(currentHexEl);

    const prevWrap = doc.createElement('div');
    prevWrap.className = 'auto-mini';
    const prevLabel = doc.createElement('span');
    prevLabel.className = 'auto-mini-label';
    prevLabel.textContent = 'prev';
    const prevSwatch = doc.createElement('div');
    prevSwatch.className = 'auto-mini-swatch';
    const prevHexEl = doc.createElement('span');
    prevHexEl.className = 'auto-hex';
    prevWrap.appendChild(prevLabel);
    prevWrap.appendChild(prevSwatch);
    prevWrap.appendChild(prevHexEl);

    const backBtn = doc.createElement('button');
    backBtn.className = 'auto-nav-btn';
    backBtn.textContent = '← Back';
    const nextBtn = doc.createElement('button');
    nextBtn.className = 'auto-nav-btn';
    nextBtn.textContent = 'Next →';

    const pCorner = doc.createElement('select');
    [['tl', 'Top-left'], ['tr', 'Top-right'], ['bl', 'Bottom-left'], ['br', 'Bottom-right']].forEach(([v, l]) => {
      const o = doc.createElement('option'); o.value = v; o.textContent = l; pCorner.appendChild(o);
    });
    const pDirection = doc.createElement('select');
    [['horizontal', 'Rows'], ['vertical', 'Columns']].forEach(([v, l]) => {
      const o = doc.createElement('option'); o.value = v; o.textContent = l; pDirection.appendChild(o);
    });

    const soundLabel = doc.createElement('label');
    soundLabel.className = 'auto-sound-toggle';
    const soundToggle = doc.createElement('input');
    soundToggle.type = 'checkbox';
    soundLabel.appendChild(soundToggle);
    soundLabel.appendChild(doc.createTextNode(' Sound'));

    const saveBtn = doc.createElement('button');
    saveBtn.className = 'auto-save-btn';
    saveBtn.textContent = 'Save & Exit';

    root.appendChild(exitBtn);
    root.appendChild(progressEl);
    root.appendChild(curWrap);
    root.appendChild(prevWrap);
    root.appendChild(backBtn);
    root.appendChild(nextBtn);
    root.appendChild(pCorner);
    root.appendChild(pDirection);
    root.appendChild(soundLabel);
    root.appendChild(saveBtn);

    exitBtn.addEventListener('click', () => {
      const wasPip = pipWindow && doc === pipWindow.document;
      stopAuto();
      if (wasPip) pipWindow.close();
    });
    backBtn.addEventListener('click', goBack);
    nextBtn.addEventListener('click', goNext);
    saveBtn.addEventListener('click', () => {
      saveSession();
      const wasPip = pipWindow && doc === pipWindow.document;
      stopAuto();
      if (wasPip) pipWindow.close();
    });
    soundToggle.addEventListener('change', () => {
      soundEnabled = soundToggle.checked;
      updateAutoPanels();
    });
    pCorner.addEventListener('change', () => {
      applyOrder(pCorner.value, sweepDirection, true);
      activateCell(sequence[autoPointer]);
    });
    pDirection.addEventListener('change', () => {
      applyOrder(startCorner, pDirection.value, true);
      activateCell(sequence[autoPointer]);
    });

    return {
      doc, root, progressEl, currentSwatch, currentHexEl, prevSwatch, prevHexEl,
      cornerSelect: pCorner, directionSelect: pDirection, backBtn, nextBtn, soundToggle
    };
  }

  function ensureAutoPanel() {
    const win = getActiveWindow();
    autoPanelInstances = autoPanelInstances.filter(p => {
      if (p.doc !== win.document) { p.root.remove(); return false; }
      return true;
    });
    if (autoPanelInstances.length === 0) {
      const isPip = win === pipWindow;
      const panel = createAutoPanel(win.document, isPip);
      if (isPip) win.document.body.insertBefore(panel.root, win.document.body.firstChild);
      else win.document.body.appendChild(panel.root);
      autoPanelInstances.push(panel);
    }
    updateAutoPanels();
  }

  function removeAutoPanels() {
    autoPanelInstances.forEach(p => p.root.remove());
    autoPanelInstances = [];
  }

  function updateAutoPanels() {
    autoPanelInstances = autoPanelInstances.filter(p => p.root.isConnected);
    autoPanelInstances.forEach(p => {
      p.progressEl.textContent = sequence.length ? `${autoPointer + 1} / ${sequence.length}` : '';
      p.currentSwatch.style.background = currentHex || '#ffffff';
      p.currentHexEl.textContent = currentHex || '—';
      p.prevSwatch.style.background = previousHex || '#ffffff';
      p.prevHexEl.textContent = previousHex || '—';
      p.backBtn.disabled = autoPointer <= 0;
      p.nextBtn.disabled = autoPointer >= sequence.length - 1;
      p.cornerSelect.value = startCorner;
      p.directionSelect.value = sweepDirection;
      p.soundToggle.checked = soundEnabled;
    });
  }

  // ---------- grid mounting + PiP ----------

  function repositionCenterGuides(gridWrap, gridW, gridH, cellSize) {
    gridWrap.querySelectorAll('.center-guide').forEach(el => el.remove());
    const centerXs = gridWrap._centerXs || [];
    const centerYs = gridWrap._centerYs || [];
    centerXs.forEach(x => {
      const xPos = PAD + x * cellSize + cellSize / 2;
      ['top', 'bottom'].forEach(side => {
        const tick = document.createElement('div');
        tick.className = 'center-guide vertical';
        tick.style.left = xPos + 'px';
        tick.style[side] = '-7px';
        gridWrap.appendChild(tick);
      });
    });
    centerYs.forEach(y => {
      const yPos = PAD + y * cellSize + cellSize / 2;
      ['left', 'right'].forEach(side => {
        const tick = document.createElement('div');
        tick.className = 'center-guide horizontal';
        tick.style.top = yPos + 'px';
        tick.style[side] = '-7px';
        gridWrap.appendChild(tick);
      });
    });
  }

  function repositionCalibration(gridWrap, cellSize) {
    gridWrap.querySelectorAll('.calibration-square').forEach(sq => {
      sq.style.width = cellSize + 'px';
      sq.style.height = cellSize + 'px';
    });
  }

  function applyCellSize(gridWrap, gridW, gridH, cellSize) {
    const grid = gridWrap.querySelector('.grid');
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;
    gridWrap.querySelectorAll('.cell').forEach(c => {
      c.style.width = cellSize + 'px';
      c.style.height = cellSize + 'px';
    });
    repositionCenterGuides(gridWrap, gridW, gridH, cellSize);
    repositionCalibration(gridWrap, cellSize);
  }

  // fits the grid to the popup's current size, keeping full aspect ratio
  // visible on one axis while cropping the other to ~3 lines for focus
  function layoutPipView() {
    if (!pipWindow || !currentGridWrap) return;
    const area = pipWindow.document.querySelector('.pip-grid-area');
    if (!area) return;
    const gridW = gridDims.w, gridH = gridDims.h;

    if (sweepDirection === 'vertical') {
      area.style.width = '';
      area.style.height = '100%';
      const availH = area.clientHeight;
      focusCellSize = Math.max(2, Math.floor((availH - PAD * 2 - BORDER * 2) / gridH));
      area.style.width = (focusCellSize * 3 + PAD * 2 + BORDER * 2) + 'px';
    } else {
      area.style.height = '';
      area.style.width = '100%';
      const availW = area.clientWidth;
      focusCellSize = Math.max(2, Math.floor((availW - PAD * 2 - BORDER * 2) / gridW));
      area.style.height = (focusCellSize * 3 + PAD * 2 + BORDER * 2) + 'px';
    }

    applyCellSize(currentGridWrap, gridW, gridH, focusCellSize);
    updateLineFocus();
  }

  function restoreManualCellSize() {
    if (!currentGridWrap) return;
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    applyCellSize(currentGridWrap, gridDims.w, gridDims.h, cellSize);
  }

  function mountGrid(gridWrap, gridW, gridH, cellSize) {
    currentGridWrap = gridWrap;
    gridWrap.dataset.gridW = gridW;
    gridWrap.dataset.gridH = gridH;
    gridWrap.dataset.cellSize = cellSize;

    if (pipWindow) {
      let area = pipWindow.document.querySelector('.pip-grid-area');
      if (!area) {
        area = pipWindow.document.createElement('div');
        area.className = 'pip-grid-area';
        area.addEventListener('click', () => { if (autoModeEnabled) goNext(); });
        pipWindow.document.body.appendChild(area);
      }
      area.innerHTML = '';
      area.appendChild(gridWrap);
      layoutPipView();
    } else {
      stage.innerHTML = '';
      stage.appendChild(gridWrap);
    }

    pipBtn.disabled = !('documentPictureInPicture' in window);
    startAutoBtn.disabled = false;
  }

  function onPipResize() { layoutPipView(); }

  async function openPip() {
    if (pipWindow) return pipWindow;
    if (!('documentPictureInPicture' in window)) return null;
    if (!currentGridWrap) return null;

    pipWindow = await documentPictureInPicture.requestWindow({ width: PIP_DEFAULT_W, height: PIP_DEFAULT_H });

    for (const styleEl of document.querySelectorAll('style')) {
      pipWindow.document.head.appendChild(styleEl.cloneNode(true));
    }
    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.style.background = '#ffffff';
    pipWindow.document.body.style.overflow = 'hidden';
    pipWindow.document.body.style.display = 'flex';
    pipWindow.document.body.style.flexDirection = 'column';
    pipWindow.document.body.style.height = '100vh';

    const gridW = parseInt(currentGridWrap.dataset.gridW, 10);
    const gridH = parseInt(currentGridWrap.dataset.gridH, 10);
    const cellSize = parseInt(currentGridWrap.dataset.cellSize, 10);
    mountGrid(currentGridWrap, gridW, gridH, cellSize);

    pipWindow.addEventListener('resize', onPipResize);

    if (autoModeEnabled) {
      attachWatcher(pipWindow);
      ensureAutoPanel();
      updateLineFocus();
    }

    pipWindow.addEventListener('pagehide', () => {
      const stillAuto = autoModeEnabled;
      pipWindow = null;
      stage.innerHTML = '';
      stage.appendChild(currentGridWrap);
      restoreManualCellSize();
      clearLineFocus();
      if (stillAuto) {
        attachWatcher(window);
        ensureAutoPanel();
      }
    }, { once: true });

    return pipWindow;
  }

  // ---------- cell click handling ----------

  function handleCellClick(index) {
    const cell = orderedCells[index];

    if (autoModeEnabled) {
      if (pipWindow && cell.ownerDocument === pipWindow.document) {
        return; // the popup's click-anywhere listener on .pip-grid-area handles this
      }
      const idx = sequence.indexOf(cell);
      if (idx !== -1) { autoPointer = idx; activateCell(cell); }
      return;
    }

    const hex = cell.dataset.hex;
    const win = cell.ownerDocument.defaultView;
    copyToClipboard(hex, win).then(ok => {
      showToastIn(win, ok ? ('Copied ' + hex) : 'Copy failed');
    });
    cell.classList.toggle('used');
  }

  // ---------- image + grid building ----------

  function buildGridFromImage(img, gridW, gridH, cellSize) {
    workCanvas.width = gridW;
    workCanvas.height = gridH;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, gridW, gridH);

    let pixelData;
    try {
      pixelData = ctx.getImageData(0, 0, gridW, gridH).data;
    } catch (err) { return null; }

    orderedCells = [];
    gridDims = { w: gridW, h: gridH };

    const gridWrap = document.createElement('div');
    gridWrap.className = 'grid-wrap';

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${gridW}, ${cellSize}px)`;
    grid.style.gridTemplateRows = `repeat(${gridH}, ${cellSize}px)`;

    const centerXs = gridW % 2 === 1 ? [(gridW - 1) / 2] : [gridW / 2 - 1, gridW / 2];
    const centerYs = gridH % 2 === 1 ? [(gridH - 1) / 2] : [gridH / 2 - 1, gridH / 2];
    gridWrap._centerXs = centerXs;
    gridWrap._centerYs = centerYs;

    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const idx = (y * gridW + x) * 4;
        const r = pixelData[idx], g = pixelData[idx + 1], b = pixelData[idx + 2];
        const hex = rgbToHex(r, g, b);

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.background = hex;
        cell.title = hex;
        cell.dataset.hex = hex;
        cell.dataset.gx = x;
        cell.dataset.gy = y;
        cell.style.setProperty('--check-color', dominantColor(hex));

        const cellIndex = orderedCells.length;
        cell.addEventListener('click', () => handleCellClick(cellIndex));
        orderedCells.push(cell);

        grid.appendChild(cell);
      }
    }

    gridWrap.appendChild(grid);
    repositionCenterGuides(gridWrap, gridW, gridH, cellSize);

    // RGB alignment reference squares, right to left: red, green, blue
    const strip = document.createElement('div');
    strip.className = 'calibration-strip';
    [['#0000ff'], ['#00ff00'], ['#ff0000']].forEach(([hex]) => {
      const sq = document.createElement('div');
      sq.className = 'calibration-square';
      sq.style.width = cellSize + 'px';
      sq.style.height = cellSize + 'px';
      sq.style.background = hex;
      sq.title = hex + ' — alignment reference';
      sq.addEventListener('click', (e) => {
        e.stopPropagation();
        const win = sq.ownerDocument.defaultView;
        copyToClipboard(hex, win).then(ok => showToastIn(win, ok ? ('Copied ' + hex) : 'Copy failed'));
      });
      strip.appendChild(sq);
    });
    gridWrap.appendChild(strip);

    return gridWrap;
  }

  // ---------- resume from localStorage ----------

  function offerResume() {
    let raw;
    try { raw = localStorage.getItem(SESSION_KEY); } catch (err) { return; }
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (err) { return; }
    if (!data || !data.imageDataURL || !data.gridW || !data.gridH) return;

    const usedCount = Array.isArray(data.usedFlags) ? data.usedFlags.filter(Boolean).length : 0;
    const total = data.gridW * data.gridH;

    const banner = document.createElement('div');
    banner.className = 'resume-banner';
    const text = document.createElement('span');
    text.textContent = `Saved session found — ${data.gridW} × ${data.gridH}, ${usedCount} of ${total} placed.`;
    const resumeBtn = document.createElement('button');
    resumeBtn.textContent = 'Resume';
    const dismissBtn = document.createElement('button');
    dismissBtn.className = 'resume-dismiss';
    dismissBtn.textContent = 'Dismiss';

    resumeBtn.addEventListener('click', () => { resumeSession(data); banner.remove(); });
    dismissBtn.addEventListener('click', () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
      banner.remove();
    });

    banner.appendChild(text);
    banner.appendChild(resumeBtn);
    banner.appendChild(dismissBtn);
    resumeBannerSlot.appendChild(banner);
  }

  function resumeSession(data) {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      loadedImageDataURL = data.imageDataURL;
      generateBtn.disabled = false;
      widthInput.value = data.gridW;
      heightInput.value = data.gridH;
      cellSizeInput.value = data.cellSize;

      stopAuto();
      const gridWrap = buildGridFromImage(img, data.gridW, data.gridH, data.cellSize);
      if (!gridWrap) return;

      if (Array.isArray(data.usedFlags)) {
        data.usedFlags.forEach((used, i) => {
          if (used && orderedCells[i]) orderedCells[i].classList.add('used');
        });
      }

      mountGrid(gridWrap, data.gridW, data.gridH, data.cellSize);
      infoText.textContent = `${data.gridW} × ${data.gridH} = ${data.gridW * data.gridH} blocks`;
      cornerSelect.value = data.corner || 'tl';
      directionSelect.value = data.direction || 'horizontal';

      startAuto(data.corner || 'tl', data.direction || 'horizontal');
    };
    img.src = data.imageDataURL;
  }

  // ---------- events ----------

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) { loadedImage = null; loadedImageDataURL = null; generateBtn.disabled = true; return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        loadedImageDataURL = e.target.result;
        generateBtn.disabled = false;
        const w = parseInt(widthInput.value, 10) || 32;
        const ratio = img.height / img.width;
        heightInput.value = Math.max(1, Math.round(w * ratio));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  widthInput.addEventListener('change', () => {
    if (!loadedImage) return;
    const w = parseInt(widthInput.value, 10) || 32;
    const ratio = loadedImage.height / loadedImage.width;
    heightInput.value = Math.max(1, Math.round(w * ratio));
  });

  [widthInput, heightInput, cellSizeInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !generateBtn.disabled) generateBtn.click();
    });
  });

  generateBtn.addEventListener('click', () => {
    if (!loadedImage) return;
    const gridW = Math.max(1, Math.min(256, parseInt(widthInput.value, 10) || 32));
    const gridH = Math.max(1, Math.min(256, parseInt(heightInput.value, 10) || 32));
    const cellSize = Math.max(4, Math.min(64, parseInt(cellSizeInput.value, 10) || 22));

    stopAuto();
    const gridWrap = buildGridFromImage(loadedImage, gridW, gridH, cellSize);
    if (!gridWrap) {
      stage.innerHTML = '<div class="placeholder">Could not read image data (possibly a cross-origin image).</div>';
      return;
    }
    mountGrid(gridWrap, gridW, gridH, cellSize);
    infoText.textContent = `${gridW} × ${gridH} = ${gridW * gridH} blocks`;
  });

  pipBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if (!('documentPictureInPicture' in window)) {
      showToastIn(window, 'PiP not supported in this browser');
      return;
    }
    await openPip();
  });

  startAutoBtn.addEventListener('click', async () => {
    if (!currentGridWrap) return;
    if ('documentPictureInPicture' in window) await openPip();
    startAuto(cornerSelect.value, directionSelect.value);
  });

  offerResume();
</script>

</body>
